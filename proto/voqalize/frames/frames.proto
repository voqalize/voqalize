// The Voqalize wire.
//
// One Envelope per websocket binary message, between the Voqalize runtime (V)
// and a brain (B). Cortex relays the bytes without reading them.
//
// The wire has two planes.
//
// The voice plane is ours: turns, speech units, what the caller actually heard,
// and the control leg. Voqalize mints `turn_id` because Voqalize decides when a
// turn commits. Speech must name the turn it answers.
//
// The RTVI plane is a tunnel. An RTVIFrame is one pipecat RTVI message
// `{id, label: "rtvi-ai", type, data}`, minus the constant label. Voqalize
// forwards the whitelisted types verbatim in both directions and interprets
// nothing else about them.
//
// Every declaration below is documented in place. Those comments are the
// contract's documentation — protoc carries them into SourceCodeInfo, so buf,
// protoc-gen-doc and any descriptor consumer read the same words you do. Prose
// that is not attached to a declaration is a section banner and nothing else.
//
// Regenerate with `make proto`.

syntax = "proto3";

package voqalize.frames;

import "google/protobuf/descriptor.proto";

// One websocket binary message. Exactly one body is set; an envelope with none
// is a protocol error, not an empty frame.
message Envelope {
  // Which frame this is. The tag numbers are grouped by plane and direction,
  // which is a reading convenience only — nothing enforces direction here.
  oneof body {
    // Voice plane, V→B.

    // Opens the session. Always the first envelope.
    SessionStart session_start = 1;
    // A committed user utterance.
    UserMessage user_message = 2;
    // The caller has gone quiet past the idle timeout.
    UserIdle user_idle = 3;
    // Everything through a turn is dead; stop generating for it.
    Interruption interruption = 4;
    // What the caller actually heard of one speech unit.
    Finalize finalize = 5;
    // The answer to exactly one Request.
    Response response = 6;

    // Voice plane, B→V.

    // Opens one speech unit.
    SpeechStart speech_start = 7;
    // One piece of that unit's text.
    SpeechChunk speech_chunk = 8;
    // Closes the unit.
    SpeechEnd speech_end = 9;
    // Asks the runtime to change something, and waits.
    Request request = 10;

    // RTVI plane, both directions.

    // One tunnelled pipecat RTVI message.
    RTVIFrame rtvi = 11;

    // Lifecycle, both directions.

    // Hang up, having said everything already sent.
    End end = 12;
    // Abandon the session now.
    Cancel cancel = 13;
    // Something went wrong, fatally or not.
    Error error = 14;
  }
}

// ─── Voice plane: V→B ────────────────────────────────────────────────────────

// First envelope of a session, and the session's first turn. A brain that does
// not speak `wire_version` refuses the session.
message SessionStart {
  // The call this is. Stable for the session's life, and the same id the brain
  // was dialled with as `?session_id=`.
  string session_id = 1;

  // The session's first turn. The greeting answers it.
  uint64 turn_id = 2;

  // Whatever the app passed at connect, JSON-encoded and opaque to the runtime.
  string init = 3;

  // The wire version the runtime speaks. A brain that speaks another one must
  // refuse rather than guess.
  uint32 wire_version = 4;
}

// A committed user utterance, on a turn of its own.
message UserMessage {
  // The turn this utterance opened. Speech answering it must name it.
  uint64 turn_id = 1;

  // The recognizer's committed transcript.
  string text = 2;
}

// The caller has been silent past the idle timeout and the brain has the floor
// to re-engage.
message UserIdle {
  // The turn the brain may speak on.
  uint64 turn_id = 1;

  // Consecutive escalations without intervening speech. Resets when the caller
  // speaks, so a brain can say something different the third time.
  uint32 level = 2;

  // Silence elapsed since the runtime stopped speaking.
  uint32 idle_ms = 3;
}

// Everything up to and including `through_turn` is dead: the caller will not
// hear it, so the brain stops generating for it.
message Interruption {
  // The newest dead turn. Monotone, unacknowledged, and self-correcting — a
  // brain that misses one is corrected by the next.
  uint64 through_turn = 1;
}

// What the caller actually heard of one speech unit. This is the only place a
// brain learns it, and on a barge-in it is not what was generated.
message Finalize {
  // The unit this closes.
  uint64 speech_id = 1;

  // The played prefix — a verbatim prefix of that unit's own text, never a
  // cross-unit concatenation. Equal to what the brain generated means it played
  // out; shorter means it was cut off; empty against chunks that were sent means
  // nothing reached the ear.
  string heard_text = 2;

  // Was `FinalizeReason reason`, retired 2026-08-27. Whether a unit was cut is
  // the comparison above, and the brain holds the half of it the runtime does
  // not: it knows what it generated. Carrying the answer as well as the terms
  // made a second copy of one fact, and a copy can disagree with the derivation
  // where the derivation cannot disagree with itself. The tag stays reserved and
  // an older brain still decodes the message, reading the field as unset.
  reserved 3;
  reserved "reason";
}

// ─── Voice plane: B→V ────────────────────────────────────────────────────────

// Opens one speech unit and binds it to the turn it answers.
message SpeechStart {
  // Minted by the brain, unique within the session.
  uint64 speech_id = 1;

  // The turn being answered. A unit that names a dead turn is dropped.
  uint64 turn_id = 2;
}

// One piece of an open speech unit's text, in order.
message SpeechChunk {
  // The unit this belongs to.
  uint64 speech_id = 1;

  // Text as generated. Chunk boundaries carry no meaning; the runtime
  // re-segments for synthesis.
  string text = 2;
}

// Closes one speech unit. A Finalize follows once the audio resolves.
message SpeechEnd {
  // The unit being closed.
  uint64 speech_id = 1;
}

// ─── The control leg ─────────────────────────────────────────────────────────

// A brain asking the runtime to change something. Exactly one Response comes
// back for every Request.
//
// The surface is deliberately narrow: how the session speaks, listens and
// responds to idle time. The recognizer's thresholds are not settable from here
// — they keep the runtime's own defaults. Recording is fixed when the session
// starts and has no mid-call operation.
message Request {
  // Names the Response that answers this. Per session, never reused.
  uint64 request_id = 1;

  // What is being asked. One op today; the point of the oneof is that adding a
  // second does not change the shape of the first.
  oneof op {
    // Change the session's configuration. See Config.
    Config configure = 2;
  }
}

// Whether the runtime took a Request.
enum Status {
  // Never sent. Present because proto3 requires a zero value.
  STATUS_UNSPECIFIED = 0;

  // Taken whole.
  STATUS_ACCEPTED = 1;

  // Applied not at all. `detail` says why.
  STATUS_REJECTED = 2;
}

// The answer to exactly one Request. Says whether the runtime took the request,
// not whether the effect is audible yet.
message Response {
  // The Request being answered.
  uint64 request_id = 1;

  // Accepted or rejected. There is no partial application.
  Status status = 2;

  // Why it was rejected, in words meant for the developer reading the log.
  // Empty on acceptance.
  string detail = 3;
}

// ─── Configuration ───────────────────────────────────────────────────────────

// A session's speech configuration, used in two places: sessions.connect
// supplies it immediately before the call starts, and the configure op changes
// it while the call is running. The agent record stores neither this message nor
// voice, language or idle settings; it stores the brain URL and a recording
// default.
//
// "Unset" reads differently at each end. At session creation it means *take
// Voqalize's default*. On the wire it means *leave it alone*: a Request carries
// a delta, and the runtime is already running.
//
// One op carries all three sections rather than three ops carrying one each,
// because a language change has to touch both legs at once. Three ops would put
// a turn boundary between the halves.
message Config {
  // How the session speaks.
  TtsConfig tts = 1;

  // How the session listens.
  SttConfig stt = 2;

  // How long it waits before re-engaging.
  IdleConfig idle = 3;
}

// The speaking leg. Applies to the next speech unit, never mid-utterance.
message TtsConfig {
  // Which recorded persona reads the text.
  optional Voice voice = 1;

  // Which reference clip that persona is cloned from — a recorded speaker, not
  // a text tag. The speech tier has clips for some languages and not others,
  // and which is which is its business, not the wire's: naming one it cannot
  // speak comes back as a rejected Response saying so.
  optional Language language = 2;
}

// The listening leg. Applies once the open turn commits, never mid-utterance.
// Acceptance is the recognizer's own answer and is all-or-nothing.
message SttConfig {
  // Which language the recognizer transcribes.
  optional Language language = 1;
}

// Idle detection: when the brain gets the floor back after silence.
message IdleConfig {
  // Silence after the runtime stops speaking before the brain is handed the
  // floor. 0 disables idle detection entirely.
  optional uint32 timeout_ms = 1;
}

// ─── The catalog ─────────────────────────────────────────────────────────────

// Options carried by the catalog enums below.
extend google.protobuf.EnumValueOptions {
  // The code the speech tier wants for this language. Not derivable from the
  // enum name: the catalog mixes ISO 639-1 two-letter codes with 639-3
  // three-letter ones, because six of these languages have no two-letter code.
  // The name is the language; this is only its spelling.
  //
  // It lives here rather than in each consumer because it is the identifier a
  // developer writes and reads, and every end of the wire has to spell it the
  // same way.
  optional string iso_code = 50001;
}

// The two omnivoice personas. The engine is chosen by the voice, not by a model
// field; there has never been a second engine to name.
enum Voice {
  // Unset. On the wire this means leave the voice alone.
  VOICE_UNSPECIFIED = 0;

  // Female.
  VOICE_OMNIVOICE_GAURI = 1;

  // Male.
  VOICE_OMNIVOICE_GAURAV = 2;
}

// English plus the 22 Indic languages the speech tier serves.
//
// Enumerated rather than a free string so a language we do not serve cannot be
// sent at all. It used to be sendable: an unserved code fell back to the
// English recognizer instead of failing, which is the quietest way there is to
// get a call wrong.
//
// Which of these can be *spoken* is a smaller set, and it is not written down
// here. Reference clips are a capability of the speech tier, they move when it
// does, and a wire contract that froze today's roster would need a new proto
// every time a clip is recorded. The runtime answers that question at the
// moment it is asked, with a rejected Response.
enum Language {
  // Unset. On the wire this means leave the language alone.
  LANGUAGE_UNSPECIFIED = 0;

  // English.
  LANGUAGE_EN = 1 [(iso_code) = "en"];

  // Assamese.
  LANGUAGE_AS = 2 [(iso_code) = "as"];

  // Bengali.
  LANGUAGE_BN = 3 [(iso_code) = "bn"];

  // Bodo.
  LANGUAGE_BRX = 4 [(iso_code) = "brx"];

  // Dogri.
  LANGUAGE_DOI = 5 [(iso_code) = "doi"];

  // Gujarati.
  LANGUAGE_GU = 6 [(iso_code) = "gu"];

  // Hindi.
  LANGUAGE_HI = 7 [(iso_code) = "hi"];

  // Kannada.
  LANGUAGE_KN = 8 [(iso_code) = "kn"];

  // Konkani.
  LANGUAGE_KOK = 9 [(iso_code) = "kok"];

  // Kashmiri.
  LANGUAGE_KS = 10 [(iso_code) = "ks"];

  // Maithili.
  LANGUAGE_MAI = 11 [(iso_code) = "mai"];

  // Malayalam.
  LANGUAGE_ML = 12 [(iso_code) = "ml"];

  // Manipuri.
  LANGUAGE_MNI = 13 [(iso_code) = "mni"];

  // Marathi.
  LANGUAGE_MR = 14 [(iso_code) = "mr"];

  // Nepali.
  LANGUAGE_NE = 15 [(iso_code) = "ne"];

  // Odia.
  LANGUAGE_OR = 16 [(iso_code) = "or"];

  // Punjabi.
  LANGUAGE_PA = 17 [(iso_code) = "pa"];

  // Sanskrit.
  LANGUAGE_SA = 18 [(iso_code) = "sa"];

  // Santali.
  LANGUAGE_SAT = 19 [(iso_code) = "sat"];

  // Sindhi.
  LANGUAGE_SD = 20 [(iso_code) = "sd"];

  // Tamil.
  LANGUAGE_TA = 21 [(iso_code) = "ta"];

  // Telugu.
  LANGUAGE_TE = 22 [(iso_code) = "te"];

  // Urdu.
  LANGUAGE_UR = 23 [(iso_code) = "ur"];
}

// ─── RTVI plane ──────────────────────────────────────────────────────────────

// The whitelist. A type absent here does not cross the wire in either
// direction: `bot-*` and `llm-*` are the runtime's own assertions about the
// media and the model, and a brain must not be able to forge them.
enum RTVIType {
  // Never sent. An envelope carrying it is rejected.
  RTVI_TYPE_UNSPECIFIED = 0;

  // "server-message" — B→V→app.
  RTVI_TYPE_SERVER_MESSAGE = 1;

  // "server-response" — B→V→app.
  RTVI_TYPE_SERVER_RESPONSE = 2;

  // "error-response" — B→V→app.
  RTVI_TYPE_ERROR_RESPONSE = 3;

  // "ui-command" — B→V→app.
  RTVI_TYPE_UI_COMMAND = 4;

  // "ui-job-group" — B→V→app.
  RTVI_TYPE_UI_JOB_GROUP = 5;

  // "client-message" — app→V→B.
  RTVI_TYPE_CLIENT_MESSAGE = 6;

  // "send-text" — app→V→B.
  RTVI_TYPE_SEND_TEXT = 7;

  // "ui-event" — app→V→B.
  RTVI_TYPE_UI_EVENT = 8;

  // "ui-snapshot" — app→V→B.
  RTVI_TYPE_UI_SNAPSHOT = 9;

  // "ui-cancel-job-group" — app→V→B.
  RTVI_TYPE_UI_CANCEL_JOB_GROUP = 10;
}

// One RTVI message, tunnelled.
message RTVIFrame {
  // Which whitelisted RTVI type this is.
  RTVIType type = 1;

  // The RTVI payload, JSON-encoded and opaque. Bounded by the client's 64 KiB
  // message limit.
  string data = 2;

  // RTVI's own correlation id, present on requests and the responses that name
  // them.
  optional string id = 3;

  // Annotates control-plane traces. Set only B→V, and never reaches the app.
  optional uint64 turn_id = 4;
}

// ─── Lifecycle ───────────────────────────────────────────────────────────────

// Hang up once everything already sent has played. Carries nothing: the reason
// belongs in the brain's own logs, not in the caller's call.
message End {}

// Abandon the session now, without waiting for pending audio.
message Cancel {
  // Why, for the log. Empty is legal.
  string reason = 1;
}

// What kind of thing went wrong.
enum ErrorCode {
  // Never sent. Present because proto3 requires a zero value.
  ERROR_CODE_UNSPECIFIED = 0;

  // Malformed or unexpected frame.
  ERROR_CODE_PROTOCOL = 1;

  // The two ends do not speak the same wire.
  ERROR_CODE_WIRE_VERSION = 2;

  // Not permitted on the RTVI plane, or oversized.
  ERROR_CODE_REJECTED = 3;

  // Dropped under congestion.
  ERROR_CODE_OVERLOAD = 4;

  // Anything else, and a bug on the sending side.
  ERROR_CODE_INTERNAL = 5;
}

// Something went wrong. Fatal or not, it is reported rather than swallowed.
message Error {
  // What kind.
  ErrorCode code = 1;

  // What happened, for the developer reading the log.
  string message = 2;

  // Whether the session is over. Non-fatal errors are informational and the
  // call continues.
  bool fatal = 3;
}
