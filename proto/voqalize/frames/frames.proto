// Voqalize cortex wire frames.
//
// The wire vocabulary between a voice runtime and a brain. Cortex relays these
// bytes without reading them; the schema is consumed only at the two ends.
//
// Regenerate with `make proto`; stubs are committed at
// sdk/python/src/voqalize/sdk/wire/_frames_pb2.py.
//
// Correlation lives in the envelope, never in a message body. Two scalars carry
// it — `epoch` and `speech_id` — and every body is then just its own payload.
// The one exception is `request_id`, which is not correlation across the
// session but the identity of a single request/response pair, and so belongs to
// the pair rather than to every envelope that passes.
//
// Direction, where V = voice runtime and B = brain:
//
//   V→B  session_start  user_message  user_idle  browser_message  interruption
//        finalize  response  end  cancel
//   B→V  speech_start  speech_chunk  speech_end  browser_command  request
//        cancel
//   both error
//
// Opaque fields (`payload`, `data`) are JSON-encoded strings, matching
// pipecat's MessageFrame.data pattern. No Struct dependency.
//
// This is version 1. The runtime stamps `SessionStart.wire_version` and a
// brain that speaks a different one refuses the session outright. The version
// gates behaviour, not parsing: protobuf ignores unknown fields by itself, so
// what a version buys is the ability to refuse rather than guess.
//
// The schema is append-only from v1. Field numbers are never reused — a retired
// one is `reserved`. Envelope arms are never renumbered. A message is reserved
// rather than removed. Adding a field or an arm does not bump the version; a
// bump means the two ends no longer speak the same wire, and that is meant
// to be rare.

syntax = "proto3";

package voqalize.frames;

// ─── Envelope ─────────────────────────────────────────────────────────────────

// Top-level message in each websocket binary payload.
// Wire layout: [1 byte direction] [Envelope bytes].
message Envelope {
  oneof body {
    SessionStart  session_start  = 1;
    UserMessage   user_message   = 2;
    UserIdle      user_idle      = 3;
    BrowserMessage browser_message = 4;
    Interruption  interruption   = 5;
    SpeechStart   speech_start   = 6;
    SpeechChunk   speech_chunk   = 7;
    SpeechEnd     speech_end     = 8;
    Finalize      finalize       = 9;
    BrowserCommand browser_command = 10;
    Request       request        = 11;
    Response      response       = 12;
    End           end            = 13;
    Cancel        cancel         = 14;
    Error         error          = 15;
  }

  // Voice-minted, session-monotonic, incremented on every stimulus the voice
  // runtime commits. The brain echoes it, unread, on everything it emits while
  // handling that stimulus.
  //
  // It exists for exactly one decision: when a barge-in opens a drain barrier,
  // the runtime must tell "emitted before the barrier" from "emitted after it,
  // in response to the new stimulus". Only a voice-minted counter can settle
  // that — a brain-minted one proves an ordering the barrier does not care
  // about. Nothing else reads it, and no brain-facing API names it.
  uint64 epoch = 51;

  // Brain-minted, session-monotonic, one per speech unit. Every envelope of
  // one unit carries the same value: the bracket (speech_start / speech_end),
  // its speech_chunk, and the finalize that reports what was heard.
  //
  // A pure correlation token, and that is its entire job. The voice runtime
  // never mints, reads, formats, orders or compares one; it echoes it back on
  // finalize exactly as it arrived, so the brain may number these however it
  // likes.
  uint64 speech_id = 52;
}

// ─── Voice → Brain ────────────────────────────────────────────────────────────

// First envelope on a session. `payload` is opaque customer init data.
message SessionStart {
  string session_id   = 1;
  string agent_id     = 2;
  string payload      = 3;  // JSON-encoded
  uint32 wire_version = 4;
}

// Committed user stimulus. Text-only today; richer content gets new fields.
message UserMessage {
  string text = 1;
}

// The user has been silent past the configured timeout and the runtime has
// opened a stimulus so the brain can re-engage. `level` counts consecutive
// escalations without intervening speech (1 = first nudge) and resets when the
// user speaks; `idle_ms` is the silence elapsed when it fired.
message UserIdle {
  uint32 level   = 1;
  uint32 idle_ms = 2;
}

// A browser→brain message. Every one is delivered — the runtime never reads
// `type` and there is no respond flag. `data` is the message payload.
message BrowserMessage {
  reserved 1;  // msg_id: minted by the browser transport, read by neither end.

  string type = 2;
  string data = 3;  // JSON-encoded
}

// The user spoke over the bot. Pipecat's InterruptionFrame.
message Interruption {}

enum FinalizeReason {
  FINALIZE_REASON_UNSPECIFIED   = 0;
  FINALIZE_REASON_COMPLETED     = 1;
  FINALIZE_REASON_USER_BARGE_IN = 2;
}

// What the user actually heard of one speech unit — never a cross-unit
// concatenation. The unit is identified by the envelope's speech_id.
message Finalize {
  string         heard_text = 1;
  FinalizeReason reason     = 2;
}

// ─── Brain → Voice ────────────────────────────────────────────────────────────

message SpeechStart {}

message SpeechChunk {
  string text = 1;
}

message SpeechEnd {}

// A brain→browser command. The brain drives the screen; `data` is whatever it
// tells the browser, relayed unread.
message BrowserCommand {
  string data = 1;  // JSON-encoded
}

// ─── The control leg ──────────────────────────────────────────────────────────
//
// The brain asks the runtime to change how the call behaves, and learns whether
// the ask was any good. Exactly one `Response` comes back for every `Request`,
// on every op, always — a brain awaiting one never has to know which ops answer.
//
// Every field of every op is `optional`, and that is load-bearing: these are
// deltas, so the runtime changes only what the brain set. Without explicit
// presence an unset field is indistinguishable from 0 or "", and a delta would
// silently become a reset.

message Request {
  // Brain-minted, session-monotonic. Its whole job is to name the `Response`.
  uint64 request_id = 1;

  oneof op {
    ConfigureTts  configure_tts  = 2;
    ConfigureStt  configure_stt  = 3;
    ConfigureIdle configure_idle = 4;
  }
}

// Whether the runtime took the request, NOT whether the effect is audible yet.
// The two differ for every op whose target applies changes on a boundary, and
// the boundary is a documented property of the op (see `ConfigureTts` and
// `ConfigureStt.language_hint`), not something the brain has to discover.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACCEPTED    = 1;
  STATUS_REJECTED    = 2;
}

message Response {
  uint64 request_id = 1;
  Status status     = 2;
  // Why it was rejected. Empty on acceptance.
  string detail     = 3;
}

// Takes effect at the next speech unit, never mid-utterance: the synthesizer
// locks voice, model, language and speed for the length of one synthesis
// context, and the runtime pins one context per unit. Accepting one of these is
// therefore the most the runtime can honestly report — there is no ask-and-
// answer with the synthesizer, only the next unit.
message ConfigureTts {
  optional string voice    = 1;
  optional string language = 2;
  optional string model    = 3;
  // 0.5 – 2.0, where 1.0 is the voice's natural rate.
  optional double speed    = 4;
}

// The thresholds apply live — the recognizer treats them as comparison bounds
// against counters that reset themselves, so changing one mid-utterance is
// safe. `language_hint` does not: a language change carries per-turn decoder
// state, so the recognizer queues it and applies it once the open turn commits.
// The turn being spoken when this arrives still transcribes as spoken; the
// change governs the next one.
//
// Acceptance here is the recognizer's own answer, not the runtime's guess, and
// it is all-or-nothing: a language the recognizer has no engine for rejects the
// whole request, thresholds included, with nothing applied.
//
// Field names match the recognizer's `Configure` message verbatim. That is the
// point of naming them here at all — this schema is the single place the
// vocabulary is written down.
message ConfigureStt {
  optional string language_hint = 1;

  optional double vad_confidence                    = 2;
  optional double vad_min_volume                    = 3;
  optional uint32 vad_start_frames                  = 4;
  optional uint32 vad_stop_frames_to_trigger_update = 5;
  optional uint32 vad_eager_frames                  = 6;
  optional uint32 vad_barge_in_ms                   = 7;
  optional uint32 resume_frames                     = 8;
  optional uint32 min_segment_speech_frames         = 9;
  optional uint32 confidence_tail_ms                = 10;
  optional double eot_threshold                     = 11;
  optional uint32 eot_timeout_ms                    = 12;
}

// Applied by the runtime itself, immediately: a running idle timer restarts on
// the new duration. `timeout_ms` is the silence after the runtime stops
// speaking before it opens an idle stimulus; 0 disables idle detection.
message ConfigureIdle {
  optional uint32 timeout_ms = 1;
}

// ─── Lifecycle ────────────────────────────────────────────────────────────────

message End {}

message Cancel {
  string reason = 1;
}

message Error {
  string error = 1;
  bool   fatal = 2;
}
