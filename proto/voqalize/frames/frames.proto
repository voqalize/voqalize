// The Voqalize wire.
//
// One Envelope per websocket binary message, between the Voqalize runtime (V)
// and a brain (B). Cortex relays the bytes without reading them.
//
// The wire has two planes.
//
// The voice plane is ours: turns, speech units, what the caller actually heard,
// and the control leg. Voqalize mints `turn_id` because Voqalize decides when a
// turn commits. Speech must name the turn it answers.
//
// The RTVI plane is a tunnel. An RTVIFrame is one pipecat RTVI message
// `{id, label: "rtvi-ai", type, data}`, minus the constant label. Voqalize
// forwards the whitelisted types verbatim in both directions and interprets
// nothing else about them.
//
// Regenerate with `make proto`.

syntax = "proto3";

package voqalize.frames;

import "google/protobuf/descriptor.proto";

message Envelope {
  oneof body {
    // Voice plane, V→B.
    SessionStart session_start = 1;
    UserMessage  user_message  = 2;
    UserIdle     user_idle     = 3;
    Interruption interruption  = 4;
    Finalize     finalize      = 5;
    Response     response      = 6;

    // Voice plane, B→V.
    SpeechStart speech_start = 7;
    SpeechChunk speech_chunk = 8;
    SpeechEnd   speech_end   = 9;
    Request     request      = 10;

    // RTVI plane, both directions.
    RTVIFrame rtvi = 11;

    // Lifecycle, both directions.
    End    end    = 12;
    Cancel cancel = 13;
    Error  error  = 14;
  }
}

// ─── Voice plane: V→B ────────────────────────────────────────────────────────

// First envelope of a session, and the session's first turn. A brain that does
// not speak `wire_version` refuses the session.
message SessionStart {
  uint64 turn_id      = 1;
  string session_id   = 2;
  string init         = 3;  // JSON-encoded
  uint32 wire_version = 4;
}

// A committed user utterance, on a turn of its own.
message UserMessage {
  uint64 turn_id = 1;
  string text    = 2;
}

// The caller has been silent past the idle timeout and the brain has the floor
// to re-engage. `level` counts consecutive escalations without intervening
// speech and resets when the caller speaks; `idle_ms` is the silence elapsed.
message UserIdle {
  uint64 turn_id = 1;
  uint32 level   = 2;
  uint32 idle_ms = 3;
}

// Everything up to and including `through_turn` is dead: the caller will not
// hear it, so the brain stops generating for it. Monotone, unacknowledged, and
// self-correcting — a brain that misses one is corrected by the next.
message Interruption {
  uint64 through_turn = 1;
}

enum FinalizeReason {
  FINALIZE_REASON_UNSPECIFIED   = 0;
  FINALIZE_REASON_COMPLETED     = 1;
  FINALIZE_REASON_USER_BARGE_IN = 2;
}

// What the caller actually heard of one speech unit. Bounded by that unit's own
// text, never a cross-unit concatenation.
message Finalize {
  uint64         speech_id  = 1;
  string         heard_text = 2;
  FinalizeReason reason     = 3;
}

// ─── Voice plane: B→V ────────────────────────────────────────────────────────

// Opens one speech unit and binds it to the turn it answers.
message SpeechStart {
  uint64 speech_id = 1;
  uint64 turn_id   = 2;
}

message SpeechChunk {
  uint64 speech_id = 1;
  string text      = 2;
}

message SpeechEnd {
  uint64 speech_id = 1;
}

// ─── The control leg ─────────────────────────────────────────────────────────
//
// Exactly one Response comes back for every Request.
//
// The surface is deliberately narrow: voice and language, and nothing else. The
// recognizer's thresholds are not settable from here — they keep the runtime's
// own defaults. We widen this as we learn what is worth naming, and a knob is
// far easier to add than to take back.

message Request {
  uint64 request_id = 1;

  reserved 2, 3, 4;  // configure_tts, configure_stt, configure_idle — one op now.

  oneof op {
    Config configure = 5;
  }
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACCEPTED    = 1;
  STATUS_REJECTED    = 2;
}

// Whether the runtime took the request, not whether the effect is audible yet.
message Response {
  uint64 request_id = 1;
  Status status     = 2;
  string detail     = 3;  // Why it was rejected. Empty on acceptance.
}

// ─── Configuration ───────────────────────────────────────────────────────────
//
// One message, three sections, used in two places: the agent record stores it as
// the session's defaults, and this op overrides them while the call is running.
// The same type in both places is the point — a record cannot drift from the
// wire if there is only one definition of what a configuration is.
//
// "Unset" reads differently at each end. In the record it means *take the
// platform default*, so a section added later does not invalidate every stored
// record. On the wire it means *leave it alone*: a Request carries a delta, and
// the runtime is already running.
//
// One op carries all three sections rather than three ops carrying one each,
// because a language change has to touch both legs at once. Three ops would put
// a turn boundary between the halves.

message Config {
  TtsConfig  tts  = 1;
  SttConfig  stt  = 2;
  IdleConfig idle = 3;
}

// Applies to the next speech unit, never mid-utterance.
message TtsConfig {
  optional Voice    voice    = 1;
  optional Language language = 2;
}

// Applies once the open turn commits, never mid-utterance. Acceptance is the
// recognizer's own answer and is all-or-nothing.
message SttConfig {
  optional Language language = 1;
}

// `timeout_ms` is the silence after the runtime stops speaking before the brain
// gets the floor. 0 disables idle detection.
message IdleConfig {
  optional uint32 timeout_ms = 1;
}

// ─── The catalog ─────────────────────────────────────────────────────────────
//
// Voices and languages are enumerated rather than free strings so that a value
// we do not serve cannot be sent at all. It used to be sendable: an unserved
// language fell back to the English recognizer instead of failing, which is the
// quietest way there is to get a call wrong.

extend google.protobuf.EnumValueOptions {
  // The code the speech tier wants for this language. Not derivable from the
  // enum name: the catalog mixes ISO 639-1 two-letter codes with 639-3
  // three-letter ones, because six of these languages have no two-letter code.
  // The name is the language; this is only its spelling.
  optional string iso_code = 50001;

  // Whether omnivoice has a reference clip recorded in this language.
  //
  // `TtsConfig.language` selects a *recorded speaker*, not a text tag, so a
  // language without a clip cannot be spoken — it would be served by the Hindi
  // clip instead, which is the right words in the wrong voice and is audible to
  // nobody but the caller. Naming one is rejected. Say what you are actually
  // getting: `stt.language = LANGUAGE_OR, tts.language = LANGUAGE_HI`.
  //
  // This is a capability of the speech tier and moves when it does. It lives
  // here because it is the one file the runtime and the control plane share, and
  // a rule the control plane cannot check is a rule that fails at connect time
  // instead of at write time.
  optional bool has_tts_clip = 50002;
}

// The two omnivoice personas. The engine is chosen by the voice, not by a model
// field; there has never been a second engine to name.
enum Voice {
  VOICE_UNSPECIFIED      = 0;
  VOICE_OMNIVOICE_GAURI  = 1;  // Female.
  VOICE_OMNIVOICE_GAURAV = 2;  // Male.
}

// English plus the 22 Indic languages `vql-stt` serves. Ten of them can also be
// spoken — see `has_tts_clip`.
enum Language {
  LANGUAGE_UNSPECIFIED = 0;

  LANGUAGE_EN  = 1  [(iso_code) = "en",  (has_tts_clip) = true];   // English
  LANGUAGE_AS  = 2  [(iso_code) = "as"];                           // Assamese
  LANGUAGE_BN  = 3  [(iso_code) = "bn",  (has_tts_clip) = true];   // Bengali
  LANGUAGE_BRX = 4  [(iso_code) = "brx"];                          // Bodo
  LANGUAGE_DOI = 5  [(iso_code) = "doi"];                          // Dogri
  LANGUAGE_GU  = 6  [(iso_code) = "gu",  (has_tts_clip) = true];   // Gujarati
  LANGUAGE_HI  = 7  [(iso_code) = "hi",  (has_tts_clip) = true];   // Hindi
  LANGUAGE_KN  = 8  [(iso_code) = "kn",  (has_tts_clip) = true];   // Kannada
  LANGUAGE_KOK = 9  [(iso_code) = "kok"];                          // Konkani
  LANGUAGE_KS  = 10 [(iso_code) = "ks"];                           // Kashmiri
  LANGUAGE_MAI = 11 [(iso_code) = "mai"];                          // Maithili
  LANGUAGE_ML  = 12 [(iso_code) = "ml",  (has_tts_clip) = true];   // Malayalam
  LANGUAGE_MNI = 13 [(iso_code) = "mni"];                          // Manipuri
  LANGUAGE_MR  = 14 [(iso_code) = "mr",  (has_tts_clip) = true];   // Marathi
  LANGUAGE_NE  = 15 [(iso_code) = "ne"];                           // Nepali
  LANGUAGE_OR  = 16 [(iso_code) = "or"];                           // Odia
  LANGUAGE_PA  = 17 [(iso_code) = "pa",  (has_tts_clip) = true];   // Punjabi
  LANGUAGE_SA  = 18 [(iso_code) = "sa"];                           // Sanskrit
  LANGUAGE_SAT = 19 [(iso_code) = "sat"];                          // Santali
  LANGUAGE_SD  = 20 [(iso_code) = "sd"];                           // Sindhi
  LANGUAGE_TA  = 21 [(iso_code) = "ta",  (has_tts_clip) = true];   // Tamil
  LANGUAGE_TE  = 22 [(iso_code) = "te",  (has_tts_clip) = true];   // Telugu
  LANGUAGE_UR  = 23 [(iso_code) = "ur"];                           // Urdu
}

// ─── RTVI plane ──────────────────────────────────────────────────────────────

// The whitelist. A type absent here does not cross the wire in either
// direction: `bot-*` and `llm-*` are the runtime's own assertions about the
// media and the model, and a brain must not be able to forge them.
enum RTVIType {
  RTVI_TYPE_UNSPECIFIED = 0;

  // B→V→app.
  RTVI_TYPE_SERVER_MESSAGE  = 1;  // "server-message"
  RTVI_TYPE_SERVER_RESPONSE = 2;  // "server-response"
  RTVI_TYPE_ERROR_RESPONSE  = 3;  // "error-response"
  RTVI_TYPE_UI_COMMAND      = 4;  // "ui-command"
  RTVI_TYPE_UI_JOB_GROUP    = 5;  // "ui-job-group"

  // app→V→B.
  RTVI_TYPE_CLIENT_MESSAGE      = 6;   // "client-message"
  RTVI_TYPE_SEND_TEXT           = 7;   // "send-text"
  RTVI_TYPE_UI_EVENT            = 8;   // "ui-event"
  RTVI_TYPE_UI_SNAPSHOT         = 9;   // "ui-snapshot"
  RTVI_TYPE_UI_CANCEL_JOB_GROUP = 10;  // "ui-cancel-job-group"
}

// One RTVI message. `data` is the RTVI payload, JSON-encoded and opaque; it is
// bounded by the client's 64 KiB message limit. `id` is RTVI's own correlation
// id, present on requests and the responses that name them. `turn_id` annotates
// control-plane traces, is set only B→V, and never reaches the app.
message RTVIFrame {
  RTVIType        type    = 1;
  string          data    = 2;
  optional string id      = 3;
  optional uint64 turn_id = 4;
}

// ─── Lifecycle ───────────────────────────────────────────────────────────────

message End {}

message Cancel {
  string reason = 1;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED  = 0;
  ERROR_CODE_PROTOCOL     = 1;  // Malformed or unexpected frame.
  ERROR_CODE_WIRE_VERSION = 2;  // The two ends do not speak the same wire.
  ERROR_CODE_REJECTED     = 3;  // Not permitted on the RTVI plane, or oversized.
  ERROR_CODE_OVERLOAD     = 4;  // Dropped under congestion.
  ERROR_CODE_INTERNAL     = 5;
}

message Error {
  ErrorCode code    = 1;
  string    message = 2;
  bool      fatal   = 3;
}
