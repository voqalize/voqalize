// Voqalize cortex wire frames.
//
// The wire vocabulary between a voice runtime and a brain. Cortex relays these
// bytes without reading them; the schema is consumed only at the two ends.
//
// Regenerate with `make proto`; stubs are committed at
// sdk/python/src/voqalize/sdk/wire/_frames_pb2.py.
//
// Correlation lives in the envelope, never in a message body. Two scalars carry
// it — `epoch` and `speech_id` — and every body is then just its own payload.
//
// Direction, where V = voice runtime and B = brain:
//
//   V→B  session_start  user_message  user_idle  client_message  interruption
//        finalize  end  cancel
//   B→V  speech_start  speech_chunk  speech_end  server_message
//        update_tts_settings  update_stt_settings  update_idle_settings  cancel
//   both error
//
// Opaque fields (`payload`, `data`, `settings`) are JSON-encoded strings,
// matching pipecat's MessageFrame.data pattern. No Struct dependency.

syntax = "proto3";

package voqalize.frames;

// ─── Envelope ─────────────────────────────────────────────────────────────────

// Top-level message in each websocket binary payload.
// Wire layout: [1 byte direction] [Envelope bytes].
message Envelope {
  oneof body {
    SessionStart         session_start        = 1;
    UserMessage          user_message         = 2;
    UserIdle             user_idle            = 3;
    ClientMessage        client_message       = 4;
    Interruption         interruption         = 5;
    SpeechStart          speech_start         = 6;
    SpeechChunk          speech_chunk         = 7;
    SpeechEnd            speech_end           = 8;
    Finalize             finalize             = 9;
    ServerMessage        server_message       = 10;
    UpdateTTSSettings    update_tts_settings  = 11;
    UpdateSTTSettings    update_stt_settings  = 12;
    UpdateIdleSettings   update_idle_settings = 13;
    End                  end                  = 14;
    Cancel               cancel               = 15;
    Error                error                = 16;
  }

  // Voice-minted, session-monotonic, incremented on every stimulus the voice
  // runtime commits. The brain echoes it, unread, on everything it emits while
  // handling that stimulus.
  //
  // It exists for exactly one decision: when a barge-in opens a drain barrier,
  // the runtime must tell "emitted before the barrier" from "emitted after it,
  // in response to the new stimulus". Only a voice-minted counter can settle
  // that — a brain-minted one proves an ordering the barrier does not care
  // about. Nothing else reads it, and no brain-facing API names it.
  uint64 epoch = 51;

  // Brain-minted, session-monotonic, one per speech unit. Every envelope of
  // one unit carries the same value: the bracket (speech_start / speech_end),
  // its speech_chunk, and the finalize that reports what was heard.
  //
  // A pure correlation token, and that is its entire job. The voice runtime
  // never mints, reads, formats, orders or compares one; it echoes it back on
  // finalize exactly as it arrived, so the brain may number these however it
  // likes.
  uint64 speech_id = 52;
}

// ─── Voice → Brain ────────────────────────────────────────────────────────────

// First envelope on a session. `payload` is opaque customer init data.
message SessionStart {
  string session_id = 1;
  string agent_id   = 2;
  string payload    = 3;  // JSON-encoded
}

// Committed user stimulus. Text-only today; richer content gets new fields.
message UserMessage {
  string text = 1;
}

// The user has been silent past the configured timeout and the runtime has
// opened a stimulus so the brain can re-engage. `level` counts consecutive
// escalations without intervening speech (1 = first nudge) and resets when the
// user speaks; `idle_ms` is the silence elapsed when it fired.
message UserIdle {
  uint32 level   = 1;
  uint32 idle_ms = 2;
}

// A browser→brain message. Every one is delivered — the runtime never reads
// `type` and there is no respond flag. `data` is the message payload.
message ClientMessage {
  string msg_id = 1;
  string type   = 2;
  string data   = 3;  // JSON-encoded
}

// The user spoke over the bot. Pipecat's InterruptionFrame.
message Interruption {}

enum FinalizeReason {
  FINALIZE_REASON_UNSPECIFIED   = 0;
  FINALIZE_REASON_COMPLETED     = 1;
  FINALIZE_REASON_USER_BARGE_IN = 2;
}

// What the user actually heard of one speech unit — never a cross-unit
// concatenation. The unit is identified by the envelope's speech_id.
message Finalize {
  string         heard_text = 1;
  FinalizeReason reason     = 2;
}

// ─── Brain → Voice ────────────────────────────────────────────────────────────

message SpeechStart {}

message SpeechChunk {
  string text = 1;
}

message SpeechEnd {}

// Pipecat's RTVIServerMessageFrame.data, bound for the browser.
message ServerMessage {
  string data = 1;  // JSON-encoded
}

message UpdateTTSSettings {
  string settings = 1;  // JSON-encoded
}

message UpdateSTTSettings {
  string settings = 1;  // JSON-encoded
}

// Idle detection config; a timeout of 0 disables it.
message UpdateIdleSettings {
  string settings = 1;  // JSON-encoded
}

// ─── Lifecycle ────────────────────────────────────────────────────────────────

message End {}

message Cancel {
  string reason = 1;
}

message Error {
  string error = 1;
  bool   fatal = 2;
}

