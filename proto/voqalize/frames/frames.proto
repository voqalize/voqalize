// Voqalize cortex wire frames.
//
// This schema is the canonical wire vocabulary between:
//   - the voice runtime (pygato / gato) and cortex
//   - the agent SDK (CortexAgent)       and cortex
//
// Cortex itself is byte-opaque; this schema is consumed only by the two
// endpoints. Generated stubs are committed alongside each SDK:
//   - sdk/python/src/voqalize/sdk/wire/_frames_pb2.py
//   - sdk/go/wire/framespb/frames.pb.go
//
// Regenerate with `make proto` (root Makefile, driven by `buf generate`).
//
// Field-number policy in `Envelope.body`:
//   1 – 30   reserved for Vql application frames
//   31 +     reserved for pipeline lifecycle / transport frames
//
// Opaque dict fields (`payload`, function call `arguments` / `result`) are
// JSON-encoded `string`, matching pipecat's `MessageFrame.data` pattern.
// No `google.protobuf.Struct` dependency.

syntax = "proto3";

package voqalize.frames;

// Go stubs for the native (no-pipecat) agent SDK. `make proto` copies the
// Python stubs into sdk/python and the Go stubs into sdk/go/wire/framespb.
option go_package = "github.com/voqalize/voqalize/sdk/go/wire/framespb;framespb";

// ─── Envelope ─────────────────────────────────────────────────────────────────

// Top-level message carried in each websocket binary payload.
// Wire layout: [1 byte direction] [Envelope serialized bytes].
//
// Ordering ack protocol (CortexLLMService ↔ CortexAgent):
//   • The pygato bridge tags outbound data frames with `request_id` (a
//     monotonically increasing uint64).
//   • The agent SDK, after the customer's `process_frame` returns for that
//     frame, sends an `Ack { ack_id = request_id }` envelope back over the
//     wire. The bridge resolves the pending future to unblock its own
//     `process_frame`, which releases pipecat's next queued frame.
//   • Lifecycle frames (Vql*Start/Interruption/End/Cancel) and SystemFrames
//     are not ack-gated — they have no `request_id`.
message Envelope {
  oneof body {
    // Vql application frames (1 – 30)
    VqlStart                   vql_start            = 1;
    VqlUserText                vql_user_text        = 2;
    VqlInterruption            vql_interruption     = 3;
    VqlInferenceFinalized      vql_inference_finalized = 4;
    VqlLLMFullResponseStart    vql_llm_start        = 5;
    VqlLLMText                 vql_llm_text         = 6;
    VqlLLMFullResponseEnd      vql_llm_end          = 7;
    VqlFunctionCallsStarted    vql_fc_started       = 8;
    VqlFunctionCallInProgress  vql_fc_in_progress   = 9;
    VqlFunctionCallResult      vql_fc_result        = 10;
    VqlInteractionCompleted    vql_interaction_completed = 11;

    // Pipeline lifecycle / transport frames (31+)
    End    end    = 31;
    Cancel cancel = 32;
    Error  error  = 33;

    // Pipecat-native frames that ride the cortex wire.
    // These are NOT Vql vocabulary — they wrap pipecat's own frame types so
    // a customer agent can drive pygato's STT/TTS/RTVI processors over the
    // wire. JSON-encoded dicts; the deserialized frame reconstructs the
    // pipecat-native type.
    RTVIServerMessage  rtvi_server_message  = 34;
    STTUpdateSettings  stt_update_settings  = 35;
    TTSUpdateSettings  tts_update_settings  = 36;
    RTVIClientMessage  rtvi_client_message  = 37;

    // Ordering acks (40+). Not application frames; consumed by the bridge.
    Ack ack = 40;
  }

  // Set by the sender on data frames that require an ack back. Zero / absent
  // means "no ack expected." Bridge-scoped counter starting at 1; receiver
  // does not need to interpret the value, only echo it.
  uint64 request_id = 50;
}

// ─── Vql application frames ───────────────────────────────────────────────────

// First frame on the wire. session_id and agent_id are named protocol fields;
// `payload` is opaque customer-defined init data, JSON-encoded.
//
// VqlStart also carries the pipecat StartFrame fields the agent's logical
// pipeline needs to bootstrap (sample rates, metrics flags). Tracing context
// is intentionally omitted — not portable across processes.
message VqlStart {
  string session_id = 1;
  string agent_id   = 2;
  string payload    = 3;

  // Inherited pipecat StartFrame fields.
  uint32 audio_in_sample_rate     = 10;
  uint32 audio_out_sample_rate    = 11;
  bool   enable_metrics           = 12;
  bool   enable_tracing           = 13;
  bool   enable_usage_metrics     = 14;
  bool   report_only_initial_ttfb = 15;
}

// Why a finalize was emitted. interrupted == true iff reason == USER_BARGE_IN;
// both are kept because consumers key off either the bool (cheap) or the reason
// (extensible). UNSPECIFIED never appears on the wire — the sender always sets it.
enum FinalizeReason {
  FINALIZE_REASON_UNSPECIFIED   = 0;
  FINALIZE_REASON_COMPLETED     = 1;
  FINALIZE_REASON_USER_BARGE_IN = 2;
}

// Committed user stimulus for one interaction. interaction_id is Voice-minted,
// session-monotonic. Emitted downstream by UserContextAggregator.
message VqlUserText {
  uint64 interaction_id = 1;
  string text           = 2;
}

// Pure interruption signal — field-less. Maps to pipecat's native
// InterruptionFrame; correlation is carried by inference_id on the data frames,
// not here.
message VqlInterruption {}

// Per-inference finalize: the text the user actually heard for ONE inference
// (never a cross-inference concatenation). interaction_id + inference_id are the
// composite key.
message VqlInferenceFinalized {
  uint64         interaction_id = 1;
  uint64         inference_id   = 2;
  string         heard_text     = 3;
  bool           interrupted    = 4;
  FinalizeReason reason         = 5;
}

message VqlLLMFullResponseStart {
  uint64 interaction_id = 1;
  uint64 inference_id   = 2;
}

message VqlLLMText {
  uint64 interaction_id = 1;
  uint64 inference_id   = 2;
  string text           = 3;
}

message VqlLLMFullResponseEnd {
  uint64 interaction_id = 1;
  uint64 inference_id   = 2;
}

message VqlFunctionCallsStarted {
  uint64 interaction_id = 1;
  uint64 inference_id   = 2;
  string tool_call_id   = 3;
  string function_name  = 4;
  string arguments      = 5;  // JSON-encoded
}

message VqlFunctionCallInProgress {
  uint64 interaction_id = 1;
  uint64 inference_id   = 2;
  string tool_call_id   = 3;
  string function_name  = 4;
  string arguments      = 5;  // JSON-encoded
}

message VqlFunctionCallResult {
  uint64 interaction_id = 1;
  uint64 inference_id   = 2;
  string tool_call_id   = 3;
  string function_name  = 4;
  string result         = 5;  // JSON-encoded
}

// Brain → Voice: the Brain is done responding to the whole interaction (emitted
// when on_interaction returns cleanly). Barge-in skips this — Voice finalizes the
// cut inference directly. Idempotent per interaction_id.
message VqlInteractionCompleted {
  uint64 interaction_id = 1;
}

// ─── Pipeline lifecycle / transport frames ────────────────────────────────────

message End {}

message Cancel {
  string reason = 1;
}

message Error {
  string error = 1;
  bool   fatal = 2;
}

// ─── Pipecat-native frames (wrappers) ─────────────────────────────────────────

// Carries pipecat's RTVIServerMessageFrame.data verbatim, JSON-encoded.
// Direction on the wire (byte prefix) is set by the sender's push_frame call;
// for browser-bound server messages the agent pushes UPSTREAM so pygato's
// RTVI processor (upstream of the cortex bridge) picks it up.
message RTVIServerMessage {
  string data = 1;  // JSON-encoded
}

// Carries pipecat's RTVIClientMessageFrame — a browser→Brain custom message
// (e.g. state_sync). pygato's RTVI processor emits it DOWNSTREAM into the cortex
// bridge, which forwards it to the customer agent; the SDK surfaces it as
// `on_app_event`. `data` is the message's `d` payload, JSON-encoded.
message RTVIClientMessage {
  string msg_id = 1;
  string type   = 2;
  string data   = 3;  // JSON-encoded
}

// Carries pipecat's STTUpdateSettingsFrame.settings (legacy dict path).
// Receiver reconstructs STTUpdateSettingsFrame(settings=<decoded>); pipecat's
// STT services convert dict → typed delta with a deprecation warning.
// Agent pushes UPSTREAM so it reaches pygato's STT (upstream of the bridge).
message STTUpdateSettings {
  string settings = 1;  // JSON-encoded dict
}

// Carries pipecat's TTSUpdateSettingsFrame.settings (legacy dict path).
// Agent pushes DOWNSTREAM so it reaches pygato's TTS (downstream of the bridge).
message TTSUpdateSettings {
  string settings = 1;  // JSON-encoded dict
}

// ─── Ordering acks ────────────────────────────────────────────────────────────

// Sent by the agent SDK after the customer's `process_frame` returns for a
// data frame the bridge sent with an ack_id. Used by the bridge to gate
// `push_frame` of subsequent plumbing frames so that pipecat's strict in-order
// dispatch contract is preserved across the websocket round-trip.
//
// Acks are wire-level — they do not appear as pipecat Frames in either
// pipeline. ack_id is bridge-scoped; counter starts at 1 and is monotonic
// per bridge instance.
message Ack {
  uint64 ack_id = 1;
}
