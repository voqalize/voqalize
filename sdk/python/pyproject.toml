[project]
name = "voqalize-agent-sdk"
version = "0.1.0"
description = "Bring the brain, we bring the voice: write a plain Python Brain, Voqalize runs the voice."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Voqalize" }]
keywords = ["voice", "agents", "realtime", "speech", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.12"
# Pipecat-free by design: installing this SDK must NOT pull pipecat. The
# customer writes a plain `Brain`; the wire is plain protobuf. `pyjwt[crypto]` is
# a runtime dep because the inbound (direct) server verifies PyGato's RS256 token
# — the `crypto` extra is what supplies RS256, and without it a clean install
# fails at verification time with "Algorithm 'RS256' could not be found".
# `cryptography` is then declared again, on its own, because
# `voqalize.conformance` imports it directly to mint the keypair a scenario signs
# with. A package you `import` is a package you declare: leaning on pyjwt's extra
# to supply it means the day pyjwt stops pulling it, the harness breaks for a
# reason nothing in this file explains.
# `pydantic` is a runtime dep because `voqalize.sdk.Action` — the typed UI
# command — IS a pydantic model, so `import voqalize.sdk` needs it. It is not an
# optional-extra candidate: an SDK that only *sometimes* exposes its typed
# surface would be a dependency fallback, and every agent framework a customer
# might pair this with already pulls pydantic anyway.
dependencies = [
    "websockets>=13",
    "loguru>=0.7",
    # Floor is the version the committed stubs assert, not the newest runtime we
    # test against: a host application that already has protobuf 5.29 must not be
    # dragged to 6.x by installing an SDK whose wire happens to be protobuf.
    "protobuf>=5.29.3,<7",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# `voqalize.sdk.gemini` — the Gemini-backed Brain base class. Optional because
# `import voqalize.sdk` must pull no model vendor. Floor is 2.x because
# `GeminiBrain` sets `thinking_config.thinking_level`, which the 1.x releases do
# not model.
gemini = ["google-genai>=2.19"]
# Deps used only by the bundled examples/ — never imported by the SDK itself.
# `examples/reference` and `examples/fastapi_inbound` mount a Brain on FastAPI and
# are served with uvicorn. `examples/echo` needs nothing but the SDK, which is the
# point of it.
examples = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

# `voqalize types` — generates the TypeScript action union from your Action
# classes, so the browser's half of an action is derived rather than copied.
[project.scripts]
voqalize = "voqalize.sdk.cli:main"

[project.urls]
Homepage = "https://voqalize.com"
Documentation = "https://docs.voqalize.com"
Source = "https://github.com/voqalize/voqalize/tree/main/sdk/python"
Changelog = "https://github.com/voqalize/voqalize/blob/main/sdk/python/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voqalize"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Make the project root importable so tests can drive the bundled `examples/`
# demos exactly as a customer would import them.
pythonpath = ["."]
