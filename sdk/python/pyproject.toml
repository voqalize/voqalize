[project]
name = "voqalize-agent-sdk"
version = "0.1.0"
requires-python = ">=3.12"
# Pipecat-free by design: installing this SDK must NOT pull pipecat. The
# customer writes a plain `Brain`; the wire is plain protobuf. `pyjwt` is a
# runtime dep because the inbound (direct) server verifies PyGato's RS256 token.
dependencies = [
    "websockets>=13",
    "loguru>=0.7",
    "protobuf>=6.30,<7",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
# Deps used only by the bundled examples/ — never imported by the SDK itself.
# `examples/travel` (OpenAI Agents + Gemini), `examples/grocery_brain`
# (OpenAI Agents), `examples/fastapi_inbound` (FastAPI/uvicorn).
examples = [
    "openai-agents>=0.17",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-genai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voqalize"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
