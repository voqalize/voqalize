[project]
name = "voqalize-agent-sdk"
version = "0.0.3"
description = "Bring the brain, we bring the voice: write a plain Python Brain, Voqalize runs the voice."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Voqalize" }]
keywords = ["voice", "agents", "realtime", "speech", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.12"
# Pipecat-free by design: installing this SDK must NOT pull pipecat. The
# customer writes a plain `Brain`; the wire is plain protobuf. `pyjwt[crypto]` is
# a runtime dep because the inbound (direct) server verifies PyGato's RS256 token
# — the `crypto` extra (cryptography) is what supplies RS256, and the conformance
# harness needs it too to mint keypairs/tokens. Without it a clean install fails
# at verification time with "Algorithm 'RS256' could not be found".
# `pydantic` is a runtime dep because `voqalize.sdk.Action` — the typed UI
# command — IS a pydantic model, so `import voqalize.sdk` needs it. It is not an
# optional-extra candidate: an SDK that only *sometimes* exposes its typed
# surface would be a dependency fallback, and every agent framework a customer
# might pair this with already pulls pydantic anyway.
dependencies = [
    "websockets>=13",
    "loguru>=0.7",
    # Floor is the version the committed stubs assert, not the newest runtime we
    # test against: a host application that already has protobuf 5.29 must not be
    # dragged to 6.x by installing an SDK whose wire happens to be protobuf.
    "protobuf>=5.29.3,<7",
    "pyjwt[crypto]>=2.8",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# The Google ADK framework integration (`voqalize.google_adk`). Optional by
# design: the core SDK stays dependency-light (`import voqalize.sdk` pulls no
# ADK). Install with `pip install voqalize-agent-sdk[adk]` to hand the SDK a
# native ADK agent and let it drive the run loop.
#
# Floor is 2.3 rather than the oldest ADK the adapter works against, because of
# what the older releases drag in: ADK <2.2 caps `starlette<1` and ADK <2.3 caps
# `opentelemetry-*<=1.41.1`, so a host application on current versions of either
# is silently walked backwards by installing this extra. 2.3 is the first release
# that pins neither.
adk = ["google-adk>=2.3,<3"]
# Deps used only by the bundled examples/ — never imported by the SDK itself.
# `examples/travel` (OpenAI Agents + Gemini), `examples/fastapi_inbound`
# (FastAPI/uvicorn).
examples = [
    "openai-agents>=0.17",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-genai>=1.0",
]

[project.urls]
Homepage = "https://voqalize.com"
Documentation = "https://voqalize.com/docs"
Source = "https://github.com/voqalize/voqalize/tree/main/sdk/python"
Changelog = "https://github.com/voqalize/voqalize/blob/main/sdk/python/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voqalize"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Make the project root importable so tests can drive the client-authored
# `examples/` demos (e.g. the ADK travel agent) as a customer would import them.
pythonpath = ["."]
