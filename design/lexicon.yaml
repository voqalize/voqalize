# The closed lexicon: a concept keeps one word across the proto, the SDK, the
# docs and the site. This file is the record, and `design/check_facts.py` is
# what reads it — there is no second copy for it to drift against.
#
# A word that is retired here is a word that once shipped. Every synonym below
# was on a real surface, which is why it is worth the machine's time: a concept
# that has two names has two explanations, and the second one is always older.
#
# Adding a term: add it here first and to the SDK second. That order is the whole
# discipline — a name that reaches code before it reaches this file is a name
# nobody argued about.

version: 1

# Concept -> the one word, and the words it replaced.
#
# These `retired` entries are NOT part of the default check, and the reason is
# worth stating: most of them are ordinary English. `call`, `event`, `tool`,
# `runtime` and `proxy` are correct in a hundred sentences that are not about
# the concept they were retired from, and a check that flags all of them is a
# check nobody runs twice. They are swept on demand, with `--sweep`, and read by
# a person. The words that are never right in any sentence — `retired_words`
# below — run every time.
terms:
  # The homepage is the positioning; this is its hero, verbatim.
  - concept: What Voqalize is
    word: voice mode for your app
    retired: [voice infrastructure, a voice API]

  - concept: The developer's WebSocket agent
    word: brain
    retired: [agent backend, bot, handler]

  - concept: One call, one socket
    word: session
    retired: [meeting, conversation, call, room]

  - concept: What Voqalize runs below text
    word: the voice tier
    retired: [the runtime, voice infrastructure]

  - concept: The runtime that dials the brain
    word: Voqalize
    retired: [Voice, our server, the bot, the runtime]

  - concept: Typed message, brain -> screen
    word: action
    retired: [UI command, event, tool]

  - concept: Screen state, screen -> brain
    word: state sync
    retired: [context push, screen capture]

  - concept: The published protocol
    word: the wire
    retired: [the protocol, our API]

  - concept: Voqalize's credential when it dials your brain
    word: the brain-connection token
    retired: [the RS256 JWT, the auth token, the pygato token]

  - concept: The browser's credential for one call
    word: the session token
    retired: []

  - concept: The relay for egress-only networks
    word: Cortex
    retired: [tunnel, proxy]

  - concept: The compatibility suite
    word: the conformance harness
    retired: [test kit, test suite]

  - concept: The 2-D talking head
    word: the avatar
    retired: [video agent, digital human]

  - concept: The account that owns agents, keys and sessions
    word: tenant
    retired: [workspace]

  - concept: The person on the call
    word: user
    retired: [caller]

  # The speak-first tool loop, SDK 0.7.0. A tool's result reaches the model with
  # the next request unless the tool carries this mark. The name is the test a
  # tool author applies — does the model need this result *now*, to say its
  # reply? — chosen for a newcomer, a coding agent above all, who must decide
  # without a trip to the docs. `@continues_turn`, `@wait_for_result`,
  # `@awaited`, `@lookup` and the rest were argued and never shipped, so none is
  # listed as retired. The `turn:` log line counts marked calls as `awaited=`;
  # that is a log field, not a word for a reader.
  - concept: The mark on a tool whose result the model reads before its reply ends
    word: '@needs_result_now'
    retired: []

  # Not "the watchdog". On the public pages the watchdog is Voqalize's own timer
  # on a committed user turn that produces no text (build/brain/speaking.md,
  # reference/errors.md), and a second thing under the same word would have two
  # explanations. The number is `gemini.tool_budget_ms` in facts.yaml.
  - concept: How long a brain's tool may run before GeminiBrain logs it as slow
    word: the tool budget
    retired: []

  - concept: Voqalize's timer on a user turn that produces no text
    word: the watchdog
    retired: []

  # Stage (2026-10-28): the agent shows and does things on a page while it
  # talks. `voqalize.sdk.stage` in the brain, `@voqalize/stage` on the page. The
  # architecture cut its vocabulary to the words below; the runtime's internals
  # (timeline, holder, director) are not words a reader needs.
  - concept: The framework an agent uses to act on a page while it talks
    word: Stage
    retired: [choreography]

  # One JSON document per app, `scene.json`; `defineScene` is its TypeScript
  # form. "Scene" stays a file and function name, not a second word for it.
  - concept: An app's declared moves, state slices and state events
    word: the Stage Spec
    retired: []

  # "Action" stays the wire message; a move is the declaration it is sent for.
  - concept: A declared thing the agent can do on a page
    word: move
    retired: [site tool, UI tool]

  - concept: A move's tier, which decides how it is delivered and checked
    word: class
    retired: [risk level]

  # The avatar's state and cue messages are a different thing, and say so
  # where both appear. A spotlight rings its target: "ring" is the verb, not
  # a second name for the spotlight.
  - concept: A move written inside the agent's reply, made as the voice reaches it
    word: cue
    retired: [screen cue]

  - concept: The point in the spoken audio where a cue fires
    word: mark
    retired: [anchor point]

  - concept: The one answer a page gives for each move
    word: result
    retired: [command done]

  - concept: The ring a page draws around what a move touches, before it acts
    word: the spotlight
    retired: []

  - concept: A named, typed piece of the page's state in the brain's mirror
    word: slice
    retired: []

  # Not "event" alone: an app event is already the word for any typed
  # message from the screen to the brain, and a state event is one of them.
  - concept: A named act that changes one slice
    word: state event
    retired: [state push]

  - concept: The page's code that carries out one move
    word: performer
    retired: []

  - concept: Moves, slices and state events many apps share, taken by name
    word: kit
    retired: []

  - concept: The lint and page checks that hold a Stage app to Stage's rules
    word: the Stage conformance checks
    retired: [conformance kit]

# Internal service and repository names. These never appear in customer-facing
# text; until 2026-08-25 nothing checked it, and three had reached the docs site
# — one of them into a filename a reader types.
#
# This runs every time, not under `--sweep`, because there is no sentence in
# which these are the right word for a customer. It sees prose only:
# `prose_lines` blanks inline code spans and skips fenced blocks, so the literal
# claim value `iss="pygato"` in `reference/wire.md` — a string a brain
# compares against, which the page justifies in place — is exempt by
# construction rather than by a special case. A leak inside a fence is still a
# leak, and `--sweep-code` would be the next thing to build; today a person
# reads the fences.
internal_names:
  - name: pygato
    say_instead: Voqalize, or "the voice tier" where the half matters
  # PyGato's successor, the runtime dev runs since 2026-10-09. The same rule:
  # which process holds the call is ours to change, and a customer never needs it.
  - name: gato
    say_instead: Voqalize, or "the voice tier" where the half matters
  - name: vql-stt
    say_instead: the recognizer
  - name: vql-speech
    say_instead: the speech tier
  - name: voqalcloud
    say_instead: Voqalize


# Retired vocabulary. Not synonyms for anything — words that assert an outcome
# the reader has not been shown.
retired_words:
  - magic
  - effortless
  - just works
  - delight
  - superpower
  - unleash
  - seamless
  - transform
  - unlock
  - supercharge
  - revolutionize
  - empower
  - leverage
  - robust
  - enterprise-grade
  - blazing
  - best-in-class
  - next-gen
  - AI-powered
  - cutting-edge

# Retired grammar. The ban is contrast against an alternative — another product,
# another vendor, or the reader's prior experience. Contrast between two things
# inside our own system stays, because that is how an API gets described, so
# these are reported for a human to judge rather than failed outright.
retired_constructions:
  - pattern: '\bunlike\b'
    name: contrast against an alternative
  - pattern: '\bno more\b'
    name: contrast against an alternative
  - pattern: '\bwithout the\b'
    name: contrast against an alternative
  - name: the fragment pair as a headline
    manual: true
  - name: the question as a heading
    manual: true
  - name: the tricolon run for cadence
    manual: true
    note: >-
      "Faster. Simpler. Yours." A plain enumeration of three true things is
      ordinary English; the cadence is the ban.

# Where these rules apply. Design notes and decision records are reasoning, and
# reasoning argues by contrast, so no rule here is checked against them.
scope:
  governed:
    - docs/src/content/docs/**
    - demos/**/README.md
    - sdk/**/README.md
  reasoning_only:
    - design/**
    - '**/AGENTS.md'
    - '**/CLAUDE.md'
  never:
    - '**/node_modules/**'
    - '**/dist/**'
    - '**/.astro/**'
    - '**/.pytest_cache/**'
    - proto/gen/**
