# Every stable product claim a Voqalize surface is allowed to repeat: numbers,
# versions, licences and dates, plus the boundaries that otherwise drift between
# the website, documentation, SDK and MCP instructions.
#
# This file exists because prose cannot be trusted with a number. Four claims on
# live pages disagreed with the code on the day it was written, and none of them
# was caught by any build: the docs said the React client was "not yet on npm"
# while npm served 0.1.1; the marketing site counted ten demos against a manifest
# of eleven; a page once advertised sixty-plus languages against a roster of
# twenty-three. Every one of those was written true and went stale in place.
#
# So a number lives here, once, next to the file it was read out of — and a
# writer cites it rather than remembering it. `design/check_facts.py` re-derives
# every fact carrying a `derive:` rule straight from that source and fails when
# the two disagree, which is what stops THIS file becoming the next stale page.
#
# Its companion is `lexicon.yaml`, which does the same job for words.
#
# Adding a fact: give it a `source` precise enough to open, a `verified` date,
# and a `derive:` rule if the source is a file in this repo. If it is not — a
# registry, or another of the four repos — give it `reproduce:`, the command
# that re-earns the stamp by hand.
#
# Fields
#   value      what may be claimed
#   source     path:line, or a URL, precise enough to open
#   verified   the day a human or the checker last saw value == source
#   derive     a machine rule against a file in this repo. One of:
#                {file, pattern}  regex, group 1 is the value
#                {file, json_pluck} {key, field} -> the list of that field
#                {glob}           number of paths matching
#   reproduce  a command, for sources no local file can settle
#   note       why the fact is sharper than it looks; read before writing prose
#   forbid     regexes that contradict this fact and must not reach a reader
#   except     path globs where a forbid hit is legitimate (dated records)

version: 1
harvested: 2026-08-28

facts:

  # ---- the wire -------------------------------------------------------------

  wire.version:
    value: 3
    source: sdk/python/src/voqalize/sdk/wire/frames.py:29
    verified: 2026-08-24
    derive:
      file: sdk/python/src/voqalize/sdk/wire/frames.py
      pattern: '^WIRE_VERSION = (\d+)$'
    note: >-
      Both ends carry their own constant and refuse a mismatch
      (ERROR_CODE_WIRE_VERSION). PyGato's copy is
      platform/backend/pygato/src/pygato/wire/frames.py:33 and must equal this.
      The address said :30 until 2026-08-25 — the value was right and the line
      was three off, which is the failure "address before assertion" exists to
      stop, in the one file whose whole job is being addressable.

  wire.dial:
    value: '{brain_url}?session_id={session_id}'
    source: proto/voqalize/frames/frames.proto
    verified: 2026-08-24
    note: >-
      Wire v3 moved the session id out of the path. The retired shape is
      {brain_url}/s/{session_id}; a brain that mounts a route there is never
      dialled, and the empty-brain_url welcome brain still answers, so the call
      greets and nobody learns.
    forbid:
      - '/s/\{session_id\}'
      - '/s/\{sid\}'

  # ---- configuration ownership --------------------------------------------

  config.agent_record:
    value: [brain_url, recording_default]
    source: platform/backend/controlplane/app/domains/agents/configuration.py AgentConfiguration
    verified: 2026-08-28
    reproduce: >-
      sed -n '/class AgentConfiguration/,/def validate_configuration/p'
      ../platform/backend/controlplane/app/domains/agents/configuration.py
    note: >-
      The Firestore agent document has one deployment field, brain_url, and one
      behavioural default, recording.enabled (false unless set). It has no
      voice, language, recognizer or idle settings. Legacy stt/tts blocks are
      dropped on read. Recording is the exception because the service writes
      and stores the audio; the value on the record is only the fallback when a
      session-connect request omits config.record.

  config.session_connect:
    value: [tts, stt, idle, record]
    source: platform/backend/controlplane/app/domains/sessions/session_config.py
    verified: 2026-08-28
    reproduce: >-
      sed -n '1,120p'
      ../platform/backend/controlplane/app/domains/sessions/session_config.py
    note: >-
      These are the configuration sections accepted just before a call starts.
      tts/stt/idle are the proto Config parsed from canonical proto3 JSON;
      record is lifted out first because recording is decided once when the
      pipeline is built and has no mid-session wire operation.

  config.brain_runtime:
    value: [tts, stt, idle]
    source: proto/voqalize/frames/frames.proto Config
    verified: 2026-08-28
    derive:
      file: proto/voqalize/frames/frames.proto
      within: '^message Config \{(.*?)^\}'
      findall: '^\s+(?:TtsConfig|SttConfig|IdleConfig)\s+(\w+)\s*='
    note: >-
      The brain may send any Config delta while the session is running and gets
      an accepted/rejected Response. TTS applies to the next speech unit, STT at
      the next committed turn boundary and idle immediately. Recording is not a
      Config field and cannot change after the call starts.

  config.publishable_browser:
    value: tts, stt and idle accepted; record false accepted; record true refused
    source: platform/backend/controlplane/app/domains/sessions/session_service.py _resolve_recording
    verified: 2026-08-28
    reproduce: >-
      sed -n '/def _resolve_recording/,/class SessionService/p'
      ../platform/backend/controlplane/app/domains/sessions/session_service.py
    note: >-
      A browser holding a publishable pk_ may call sessions.connect directly and
      supply the same config as any caller. The only credential-specific rule
      is recording: false is always honoured, true is HTTP 400
      recording_not_permitted, and omission uses the agent's recording default.
      A browser that calls its own backend does not call Voqalize and therefore
      supplies no Voqalize configuration itself; its backend makes that choice.

  # ---- the Python brain SDK -------------------------------------------------

  sdk.python.package:
    value: voqalize-agent-sdk
    source: sdk/python/pyproject.toml:2
    verified: 2026-08-24
    derive:
      file: sdk/python/pyproject.toml
      pattern: '^name = "(.+)"$'

  sdk.python.version.tree:
    value: '0.2.0'
    source: sdk/python/pyproject.toml:3
    verified: 2026-08-27
    derive:
      file: sdk/python/pyproject.toml
      pattern: '^version = "(.+)"$'
    note: >-
      Bumped to 0.2.0 on 2026-08-27, and the minor rather than the patch for the
      same reason 0.1.0 was: the surface breaks. FinalizeReason is gone and
      Finalize carries a third field, so a caller that constructs one no longer
      compiles. Under 1.0 that is what a minor is for. Derived, so this line
      cannot drift from pyproject.toml — but the number it should be compared
      against is sdk.python.version.published, not this one, and the two are
      deliberately apart between a bump and the tag that publishes it.

  sdk.python.version.published:
    value: '0.2.0'
    source: https://pypi.org/pypi/voqalize-agent-sdk/json
    verified: 2026-08-27
    reproduce: >-
      curl -s https://pypi.org/pypi/voqalize-agent-sdk/json
      | python3 -c "import sys,json;print(json.load(sys.stdin)['info']['version'])"
    note: >-
      Published 2026-08-27 by the `python-sdk-v0.2.0` tag, and level with
      sdk.python.version.tree again. 0.2.0 retires FinalizeReason and gives
      Finalize its third field; 0.1.0 was the first published version of the
      Brain, run_session and serve surface, and 0.0.3 exposed the incompatible
      Interaction, Conversation, serve_direct and serve_auto API. Documentation
      install lines stay pinned to the published number so examples and
      installed code cannot silently drift apart — move them with this line.
      The control plane resolves the SDK from PyPI rather than from the sibling
      tree, so this number is also what unblocks a platform proto change: until
      it moves, the two copies of the wire stub in that repo cannot agree.

  sdk.python.stability:
    value: alpha; Python >=3.12; pre-1.0 surface may change
    source: https://pypi.org/pypi/voqalize-agent-sdk/json
    verified: 2026-08-28
    reproduce: >-
      curl -s https://pypi.org/pypi/voqalize-agent-sdk/json
      | python3 -c "import sys,json;d=json.load(sys.stdin)['info'];print(d['requires_python'], [x for x in d['classifiers'] if x.startswith('Development Status')])"
    note: >-
      The registry classifies the package as Development Status 3 - Alpha and
      requires Python >=3.12. Install examples pin sdk.python.version.published;
      the stability sentence carries no promise of callback compatibility before
      1.0.

  sdk.python.surface.published:
    value: [Action, Brain, Channel, Chunk, Error, ErrorCode, Finalize, RTVIMessage,
            RTVIType, RequestRejected, Session, SessionRejected, Speech, SpeechEnd,
            SpeechStart, UserIdle, UserMessage, WireError, configure_logging,
            run_session, serve, session_context]
    source: https://pypi.org/pypi/voqalize-agent-sdk/0.2.0/json
    verified: 2026-08-27

  sdk.python.surface.tree:
    value: [Action, Brain, Channel, Chunk, Error, ErrorCode, Finalize, RTVIMessage,
            RTVIType, RequestRejected, Session, SessionRejected, Speech, SpeechEnd,
            SpeechStart, UserIdle, UserMessage, WireError, configure_logging,
            run_session, serve, session_context]
    source: sdk/python/src/voqalize/sdk/__init__.py
    verified: 2026-08-25
    derive:
      file: sdk/python/src/voqalize/sdk/__init__.py
      within: '^__all__\s*=\s*\[(.*?)\]'
      findall: '"([^"]+)"'
    note: >-
      Twenty-two names, read out of __all__ on 2026-08-25 — the roster this tree
      ships as 0.1.0. It was recorded as nine on 2026-08-24 while the hardening
      agent held brain.py, and the nine were the ones the board had confirmed
      rather than the whole export. Two things are NOT in it and are asked for
      often: GeminiBrain lives in voqalize.sdk.gemini behind the `gemini` extra
      and is deliberately not re-exported here, and **there is no AdkBrain** —
      the ADK adapter was deleted, and the apex claimed it shipped until this
      was caught on 2026-08-25.
    forbid:
      - '\bAdkBrain\b'

  sdk.python.pipecat:
    value: none
    source: sdk/python/pyproject.toml:20
    verified: 2026-08-24
    note: >-
      Pipecat-free by design, and the claim is about the dependency tree rather
      than a version: installing the brain SDK must not pull pipecat. The
      version below belongs to the voice tier, which the customer never installs.

  # ---- the React client SDK (retired) ---------------------------------------
  #
  # The source left this tree on 2026-08-24. What remains here is what a customer
  # can still observe from outside it: a name on npm, a last version, and a
  # deprecation notice. Every fact below is therefore registry-sourced and
  # attested by a command, not derived from a file — there is no file left.

  sdk.react.package:
    value: '@voqalize/client-react'
    source: https://registry.npmjs.org/@voqalize/client-react
    verified: 2026-08-24
    reproduce: >-
      curl -s https://registry.npmjs.org/@voqalize%2Fclient-react
      | python3 -c "import sys,json;print(json.load(sys.stdin)['name'])"
    note: >-
      The name is claimed and stays claimed. Deprecating does not unpublish, and
      unpublishing would break the ten demo UIs still resolving ^0.1.0 — and
      anyone else who built against it.

  sdk.react.version.published:
    value: '0.1.1'
    source: https://registry.npmjs.org/@voqalize/client-react
    verified: 2026-08-24
    reproduce: >-
      curl -s https://registry.npmjs.org/@voqalize%2Fclient-react
      | python3 -c "import sys,json;print(json.load(sys.stdin)['dist-tags']['latest'])"
    note: >-
      Published 2026-08-13; versions are 0.0.1, 0.1.0, 0.1.1. Frozen there — see
      sdk.react.deprecated. Nothing further publishes: the release workflow was
      deleted with the source. There was a 0.3.0 staged in-tree that never
      published; it is gone, and this is the only version a customer ever saw.

  sdk.react.deprecated:
    value: deprecated 2026-08-24, no replacement package
    source: docs/src/content/docs/build/connect.md
    verified: 2026-08-24
    reproduce: >-
      curl -s https://registry.npmjs.org/@voqalize%2Fclient-react
      | python3 -c "import sys,json;d=json.load(sys.stdin);v=d['dist-tags']['latest'];print(d['versions'][v].get('deprecated','NOT DEPRECATED'))"
    note: >-
      THE FACT THAT RETIRES A SURFACE. The package existed to do two things a
      page could not do for itself: lift connect params out of a SessionDetail,
      and rebuild `headers` as a real `Headers`. `sessions.connect` (2026-08-24)
      answers in the shape pipecat's transport takes, so the first is gone; the
      second is one line, written down in `client/handshake`. There is no
      successor package and there must not be one — the browser half of a call is
      pipecat's, and a wrapper is a second surface to learn and a lag behind
      every pipecat release. No page may carry an install line for it, and no
      page may promise a replacement. The source was deleted from this repo the
      same day, so there is nothing left to point a reader at either.
    forbid:
      - 'not yet on npm'
      - 'Not yet on npm'
      - 'pnpm add @voqalize/client-react'
      - 'npm install @voqalize/client-react'
      - 'yarn add @voqalize/client-react'
    except:
      - '**/CHANGELOG.md'
      - '**/changelog.astro'

  repo.voqalize.licence:
    value: Apache-2.0
    source: LICENSE
    verified: 2026-08-24

  # ---- the avatar library (sibling repo, MIT, published in lockstep) ---------

