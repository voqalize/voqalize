# Every stable product claim a Voqalize surface is allowed to repeat: numbers,
# versions, licences and dates, plus the boundaries that otherwise drift between
# the website, documentation, SDK and MCP instructions.
#
# This file exists because prose cannot be trusted with a number. Four claims on
# live pages disagreed with the code on the day it was written, and none of them
# was caught by any build: the docs said the React client was "not yet on npm"
# while npm served 0.1.1; the marketing site counted ten demos against a manifest
# of eleven; a page once advertised sixty-plus languages against a roster of
# twenty-three. Every one of those was written true and went stale in place.
#
# So a number lives here, once, next to the file it was read out of — and a
# writer cites it rather than remembering it. `design/check_facts.py` re-derives
# every fact carrying a `derive:` rule straight from that source and fails when
# the two disagree, which is what stops THIS file becoming the next stale page.
#
# Its companion is `lexicon.yaml`, which does the same job for words.
#
# Adding a fact: give it a `source` precise enough to open, a `verified` date,
# and a `derive:` rule if the source is a file in this repo. If it is not — a
# registry, or another of the four repos — give it `reproduce:`, the command
# that re-earns the stamp by hand.
#
# Fields
#   value      what may be claimed
#   source     path:line, or a URL, precise enough to open
#   verified   the day a human or the checker last saw value == source
#   derive     a machine rule against a file in this repo. One of:
#                {file, pattern}  regex, group 1 is the value
#                {file, json_pluck} {key, field} -> the list of that field
#                {glob}           number of paths matching
#   reproduce  a command, for sources no local file can settle
#   note       why the fact is sharper than it looks; read before writing prose
#   forbid     regexes that contradict this fact and must not reach a reader
#   except     path globs where a forbid hit is legitimate (dated records)

version: 1
harvested: 2026-08-28

facts:

  # ---- the wire -------------------------------------------------------------

  wire.version:
    value: 3
    source: sdk/python/src/voqalize/sdk/wire/frames.py:29
    verified: 2026-08-24
    derive:
      file: sdk/python/src/voqalize/sdk/wire/frames.py
      pattern: '^WIRE_VERSION = (\d+)$'
    note: >-
      Both ends carry their own constant and refuse a mismatch
      (ERROR_CODE_WIRE_VERSION). PyGato's copy is
      platform/backend/pygato/src/pygato/wire/frames.py:33 and must equal this.
      The address said :30 until 2026-08-25 — the value was right and the line
      was three off, which is the failure "address before assertion" exists to
      stop, in the one file whose whole job is being addressable.

  wire.dial:
    value: '{brain_url}?session_id={session_id}'
    source: proto/voqalize/frames/frames.proto
    verified: 2026-08-24
    note: >-
      Wire v3 moved the session id out of the path. The retired shape is
      {brain_url}/s/{session_id}; a brain that mounts a route there is never
      dialled, and the empty-brain_url welcome brain still answers, so the call
      greets and nobody learns.
    forbid:
      - '/s/\{session_id\}'
      - '/s/\{sid\}'

  wire.close.no_agent:
    value: 4000
    source: sdk/python/src/voqalize/sdk/wire/transport.py:49 CLOSE_NO_AGENT
    verified: 2026-09-21
    derive:
      file: sdk/python/src/voqalize/sdk/wire/transport.py
      pattern: '^CLOSE_NO_AGENT = (\d+)'
    note: >-
      The one close code with a meaning: permanent, never retried, and the code
      a brain closes with when it will not serve this session — a bad token, an
      agent it does not host. Every other close is transient and Cortex dials
      again. It is on four pages because it is the answer to four different
      questions, so it is here rather than retyped from memory.

  rtvi.payload.max_bytes:
    value: 64 KiB
    source: proto/voqalize/frames/frames.proto:481 Rtvi.payload
    verified: 2026-09-21
    reproduce: >-
      grep -n 'KiB' proto/voqalize/frames/frames.proto
    note: >-
      The bound is the pipecat client's, not ours: the data channel decides what
      a message may weigh and the wire carries what the client will send. An
      oversized envelope comes back ERROR_CODE_REJECTED, which is also what a
      type outside the RTVI whitelist gets. Written "64 KiB" wherever it
      appears, because KiB is the unit the client's own documentation uses.

  # ---- configuration ownership --------------------------------------------

  config.agent_record:
    value: [brain_url, recording_default]
    source: platform/backend/controlplane/app/domains/agents/configuration.py AgentConfiguration
    verified: 2026-08-28
    reproduce: >-
      sed -n '/class AgentConfiguration/,/def validate_configuration/p'
      ../platform/backend/controlplane/app/domains/agents/configuration.py
    note: >-
      The Firestore agent document has one deployment field, brain_url, and one
      behavioural default, recording.enabled (false unless set). It has no
      voice, language, recognizer or idle settings. Legacy stt/tts blocks are
      dropped on read. Recording is the exception because the service writes
      and stores the audio; the value on the record is only the fallback when a
      session-connect request omits config.record.

  config.session_connect:
    value: [tts, stt, idle, record]
    source: platform/backend/controlplane/app/domains/sessions/session_config.py
    verified: 2026-08-28
    reproduce: >-
      sed -n '1,120p'
      ../platform/backend/controlplane/app/domains/sessions/session_config.py
    note: >-
      These are the configuration sections accepted just before a call starts.
      tts/stt/idle are the proto Config parsed from canonical proto3 JSON;
      record is lifted out first because recording is decided once when the
      pipeline is built and has no mid-session wire operation.

  config.brain_runtime:
    value: [tts, stt, idle]
    source: proto/voqalize/frames/frames.proto Config
    verified: 2026-08-28
    derive:
      file: proto/voqalize/frames/frames.proto
      within: '^message Config \{(.*?)^\}'
      findall: '^\s+(?:TtsConfig|SttConfig|IdleConfig)\s+(\w+)\s*='
    note: >-
      The brain may send any Config delta while the session is running and gets
      an accepted/rejected Response. TTS applies to the next speech unit, STT at
      the next committed turn boundary and idle immediately. Recording is not a
      Config field and cannot change after the call starts.

  config.publishable_browser:
    value: tts, stt and idle accepted; record false accepted; record true refused
    source: platform/backend/controlplane/app/domains/sessions/session_service.py _resolve_recording
    verified: 2026-08-28
    reproduce: >-
      sed -n '/def _resolve_recording/,/class SessionService/p'
      ../platform/backend/controlplane/app/domains/sessions/session_service.py
    note: >-
      A browser holding a publishable pk_ may call sessions.connect directly and
      supply the same config as any caller. The only credential-specific rule
      is recording: false is always honoured, true is HTTP 400
      recording_not_permitted, and omission uses the agent's recording default.
      A browser that calls its own backend does not call Voqalize and therefore
      supplies no Voqalize configuration itself; its backend makes that choice.

  # ---- the Python brain SDK -------------------------------------------------

  sdk.python.package:
    value: voqalize-agent-sdk
    source: sdk/python/pyproject.toml:2
    verified: 2026-08-24
    derive:
      file: sdk/python/pyproject.toml
      pattern: '^name = "(.+)"$'

  sdk.python.version.tree:
    value: '0.5.0'
    source: sdk/python/pyproject.toml:3
    verified: 2026-09-21
    derive:
      file: sdk/python/pyproject.toml
      pattern: '^version = "(.+)"$'
    note: >-
      Bumped to 0.5.0 on 2026-09-21, for stt.patience: SttConfig gains the
      field and frames.proto gains `optional uint32 patience = 2`. The surface
      only grows and the wire change is additive on both halves, so a brain on
      an older SDK sends no patience and is served exactly as before — under
      1.0 an added field still takes the minor, because the dataclass is a
      contract a developer writes against. 0.4.0 was the kokoro voices. Derived,
      so this line cannot drift from pyproject.toml — but the number it should
      be compared against is sdk.python.version.published, not this one, and the
      two are deliberately apart between a bump and the tag that publishes it.

  sdk.python.version.published:
    value: '0.5.0'
    source: https://pypi.org/pypi/voqalize-agent-sdk/json
    verified: 2026-09-21
    reproduce: >-
      curl -s https://pypi.org/pypi/voqalize-agent-sdk/json
      | python3 -c "import sys,json;print(json.load(sys.stdin)['info']['version'])"
    note: >-
      Published 2026-09-21 by the `python-sdk-v0.5.0` tag, and level with
      sdk.python.version.tree again. 0.5.0 puts stt.patience on the wire — a
      bounded 0..10 scale on SttConfig, additive on both halves, so a brain on
      0.4.0 sends none and is served the calibration its deployment already
      runs. 0.4.0 put the kokoro voices on the wire — the KOKORO_* members of
      Voice and the voice_id enum-value option the serializer builds its tables
      from — additively, so a brain on 0.3.0 keeps sending
      VOICE_OMNIVOICE_GAURAV and is understood unchanged. 0.3.0 added
      AppEvent, AppEvents and SpeechChunk and started warning on an app event
      carried by client-message; 0.2.0 retired FinalizeReason and gave Finalize
      its third field; 0.1.0 was the first published version of the Brain,
      run_session and serve surface, and 0.0.3 exposed the incompatible
      Interaction, Conversation, serve_direct and serve_auto API. Documentation
      install lines stay pinned to the published number so examples and
      installed code cannot silently drift apart — move them with this line.
      The control plane resolves the SDK from PyPI rather than from the sibling
      tree, so this number is also what unblocks a platform proto change: until
      it moves, the two copies of the wire stub in that repo cannot agree.

  sdk.python.stability:
    value: alpha; Python >=3.12; pre-1.0 surface may change
    source: https://pypi.org/pypi/voqalize-agent-sdk/json
    verified: 2026-08-28
    reproduce: >-
      curl -s https://pypi.org/pypi/voqalize-agent-sdk/json
      | python3 -c "import sys,json;d=json.load(sys.stdin)['info'];print(d['requires_python'], [x for x in d['classifiers'] if x.startswith('Development Status')])"
    note: >-
      The registry classifies the package as Development Status 3 - Alpha and
      requires Python >=3.12. Install examples pin sdk.python.version.published;
      the stability sentence carries no promise of callback compatibility before
      1.0.

  sdk.python.surface.published:
    value: [Action, AppEvent, AppEvents, Brain, Channel, Chunk, Error, ErrorCode,
            Finalize, RTVIMessage, RTVIType, RequestRejected, Session, SessionRejected,
            Speech, SpeechChunk, SpeechEnd, SpeechStart, UserIdle, UserMessage,
            WireError, configure_logging, run_session, serve, session_context]
    source: https://pypi.org/pypi/voqalize-agent-sdk/0.5.0/json
    verified: 2026-09-21
    reproduce: >-
      uv venv /tmp/v -q --python 3.12
      && VIRTUAL_ENV=/tmp/v uv pip install -q voqalize-agent-sdk==0.5.0
      && /tmp/v/bin/python -c "import voqalize.sdk as s;print(sorted(s.__all__))"
    note: >-
      Read out of the installed 0.5.0 wheel on 2026-09-21, not out of the tree
      and not out of the release notes: this fact exists to catch the case where
      what PyPI serves is not what this repo thinks it published. Unchanged by
      0.5.0 — that release adds a field to SttConfig, which is not an export —
      so it is still level with sdk.python.surface.tree, and expected to fall
      behind it again the moment an export lands on main.

  sdk.python.surface.tree:
    value: [Action, AppEvent, AppEvents, Brain, Channel, Chunk, Error, ErrorCode,
            Finalize, RTVIMessage, RTVIType, RequestRejected, Session, SessionRejected,
            Speech, SpeechChunk, SpeechEnd, SpeechStart, UserIdle, UserMessage,
            WireError, configure_logging, run_session, serve, session_context]
    source: sdk/python/src/voqalize/sdk/__init__.py
    verified: 2026-09-09
    derive:
      file: sdk/python/src/voqalize/sdk/__init__.py
      within: '^__all__\s*=\s*\[(.*?)\]'
      findall: '"([^"]+)"'
    note: >-
      Twenty-five names, read out of __all__ on 2026-09-09 — the roster this
      tree ships as 0.1.0. It became twenty-three when `Chunk` was renamed
      `SpeechChunk` and the old name kept as an alias, and twenty-five when
      `AppEvent`/`AppEvents` landed as `Action`'s symmetric twin for the
      app→brain direction. All twenty-five shipped in 0.3.0 on 2026-09-20, so
      `sdk.python.surface.published` is level with this list again; it falls
      behind whenever an export lands on main, and that is not a defect. It was recorded as nine on 2026-08-24 while the hardening
      agent held brain.py, and the nine were the ones the board had confirmed
      rather than the whole export. Two things are NOT in it and are asked for
      often: GeminiBrain lives in voqalize.sdk.gemini behind the `gemini` extra
      and is deliberately not re-exported here, and **there is no AdkBrain** —
      the ADK adapter was deleted, and the apex claimed it shipped until this
      was caught on 2026-08-25.
    forbid:
      - '\bAdkBrain\b'

  sdk.engine.bulk_maxsize:
    value: 256
    source: sdk/python/src/voqalize/sdk/engine.py:49 DEFAULT_BULK_MAXSIZE
    verified: 2026-09-21
    derive:
      file: sdk/python/src/voqalize/sdk/engine.py
      pattern: '^DEFAULT_BULK_MAXSIZE = (\d+)$'
    note: >-
      The bulk lane each way; the priority lane beside it is 32 and is a
      tripwire rather than a budget — it is never expected to fill, and a full
      one raises rather than sheds. Shedding is drop-newest and only droppable
      frames are shed, so a full bulk lane loses new speech chunks and never an
      End. The number reaches a reader as "the outbound bulk lane holds 256
      frames by default", which is a sentence about backpressure, so it needs
      the source rather than a memory of it.

  gemini.max_tool_hops:
    value: 6
    source: sdk/python/src/voqalize/sdk/gemini_interactions.py:106 max_tool_hops
    verified: 2026-09-21
    derive:
      file: sdk/python/src/voqalize/sdk/gemini_interactions.py
      pattern: '^\s+max_tool_hops: int = (\d+),$'
    note: >-
      A constructor default on GeminiInteractionsBrain, which runs the tool loop
      itself. GeminiBrain has no equivalent knob: google-genai runs the hops and
      the limit is its own. Every hop is a model round trip, so this is a number
      a reader counts against the turn budget.

  sdk.python.pipecat:
    value: none
    source: sdk/python/pyproject.toml:20
    verified: 2026-08-24
    note: >-
      Pipecat-free by design, and the claim is about the dependency tree rather
      than a version: installing the brain SDK must not pull pipecat. The
      version below belongs to the voice tier, which the customer never installs.

  # ---- the React client SDK (retired) ---------------------------------------
  #
  # The source left this tree on 2026-08-24. What remains here is what a customer
  # can still observe from outside it: a name on npm, a last version, and a
  # deprecation notice. Every fact below is therefore registry-sourced and
  # attested by a command, not derived from a file — there is no file left.

  sdk.react.package:
    value: '@voqalize/client-react'
    source: https://registry.npmjs.org/@voqalize/client-react
    verified: 2026-08-24
    reproduce: >-
      curl -s https://registry.npmjs.org/@voqalize%2Fclient-react
      | python3 -c "import sys,json;print(json.load(sys.stdin)['name'])"
    note: >-
      The name is claimed and stays claimed. Deprecating does not unpublish, and
      unpublishing would break the ten demo UIs still resolving ^0.1.0 — and
      anyone else who built against it.

  sdk.react.version.published:
    value: '0.1.1'
    source: https://registry.npmjs.org/@voqalize/client-react
    verified: 2026-08-24
    reproduce: >-
      curl -s https://registry.npmjs.org/@voqalize%2Fclient-react
      | python3 -c "import sys,json;print(json.load(sys.stdin)['dist-tags']['latest'])"
    note: >-
      Published 2026-08-13; versions are 0.0.1, 0.1.0, 0.1.1. Frozen there — see
      sdk.react.deprecated. Nothing further publishes: the release workflow was
      deleted with the source. There was a 0.3.0 staged in-tree that never
      published; it is gone, and this is the only version a customer ever saw.

  sdk.react.deprecated:
    value: deprecated 2026-08-24, no replacement package
    source: docs/src/content/docs/build/connect.md
    verified: 2026-08-24
    reproduce: >-
      curl -s https://registry.npmjs.org/@voqalize%2Fclient-react
      | python3 -c "import sys,json;d=json.load(sys.stdin);v=d['dist-tags']['latest'];print(d['versions'][v].get('deprecated','NOT DEPRECATED'))"
    note: >-
      THE FACT THAT RETIRES A SURFACE. The package existed to do two things a
      page could not do for itself: lift connect params out of a SessionDetail,
      and rebuild `headers` as a real `Headers`. `sessions.connect` (2026-08-24)
      answers in the shape pipecat's transport takes, so the first is gone; the
      second is one line, written down in `client/handshake`. There is no
      successor package and there must not be one — the browser half of a call is
      pipecat's, and a wrapper is a second surface to learn and a lag behind
      every pipecat release. No page may carry an install line for it, and no
      page may promise a replacement. The source was deleted from this repo the
      same day, so there is nothing left to point a reader at either.
    forbid:
      - 'not yet on npm'
      - 'Not yet on npm'
      - 'pnpm add @voqalize/client-react'
      - 'npm install @voqalize/client-react'
      - 'yarn add @voqalize/client-react'
    except:
      - '**/CHANGELOG.md'
      - '**/changelog.astro'

  repo.voqalize.licence:
    value: Apache-2.0
    source: sdk/python/pyproject.toml:6 license
    verified: 2026-09-21
    derive:
      file: sdk/python/pyproject.toml
      pattern: '^license = "(.+)"$'
    note: >-
      `LICENSE` at the repo root is the licence itself, and its text spells the
      name out rather than naming the SPDX identifier a reader writes. The
      pyproject field is that identifier, it is what PyPI publishes the package
      under, and `license-files = ["LICENSE"]` beside it is what ties the two
      together — so the derivable claim and the file a reader opens cannot part.

  # ---- the avatar library (MIT, published from the public sibling) ----------
  #
  # The avatar line is two repos and the names invert: the published library is
  # `avatar-public/` on disk, which is the remote `voqalize/avatar`. Every source
  # below is that checkout, because it is what npm and PyPI are cut from —
  # `avatar-private/` (the remote `voqalize/avatar-private`) is where the work
  # happens and publishes nothing.

  avatar.npm.package:
    value: '@voqalize/avatar'
    source: avatar-public/packages/avatar/package.json
    verified: 2026-09-20
    reproduce: grep '"name"' ../avatar-public/packages/avatar/package.json

  avatar.pypi.package:
    value: voqalize-avatar
    source: avatar-public/packages/avatar-py/pyproject.toml:2
    verified: 2026-09-20
    reproduce: sed -n 2p ../avatar-public/packages/avatar-py/pyproject.toml

  avatar.npm.version:
    value: '0.4.2'
    source: avatar-public/packages/avatar/package.json
    verified: 2026-09-21
    reproduce: npm view @voqalize/avatar version
    note: >-
      There is no single avatar version. npm and PyPI publish independently, from
      `npm-v` and `py-v` tags, because the wire is what keeps the two ends
      compatible rather than a shared number — so a page that prints one version
      for "the avatar library" is wrong about one of them. A different repo, so
      no derive rule reaches it.
    forbid_literal:
      # A version named in a sentence, not a pin: `npm install pkg@0.4.1` is
      # still legal, `@voqalize/avatar 0.4.1` is the claim this fact denies.
      - '@voqalize/avatar`? \d+\.\d+\.\d+'
      - 'voqalize-avatar`? \d+\.\d+\.\d+'

  avatar.pypi.version:
    value: '0.4.0'
    source: avatar-public/packages/avatar-py/pyproject.toml:3
    verified: 2026-09-20
    reproduce: curl -s https://pypi.org/pypi/voqalize-avatar/json | jq -r .info.version
    note: >-
      Behind the npm number on purpose, not by neglect; see `avatar.npm.version`.

  avatar.licence:
    value: MIT
    source: avatar-public/LICENSE
    verified: 2026-09-20
    reproduce: head -1 ../avatar-public/LICENSE
    note: >-
      MIT, and deliberately not Apache-2.0 like this repo. A page that states one
      licence for "our open source" is wrong about one of the two.

  avatar.assets.licence:
    value: CC-BY-4.0
    source: avatar-public/packages/avatar/package.json:5 license
    verified: 2026-09-21
    reproduce: >-
      grep -n '"license"' ../avatar-public/packages/avatar/package.json &&
      head -1 ../avatar-public/LICENSE-CC-BY-4.0
    note: >-
      The character binaries the faces load are artwork, not code, and they are
      licensed apart from the MIT library around them — the package declares
      `MIT AND CC-BY-4.0` for exactly that reason. CC-BY asks for attribution
      and nothing else, which is the whole of what a customer has to do. A page
      that names one licence for the avatar is wrong about half of it.

  # ---- the voice tier -------------------------------------------------------

  stt.patience.range:
    value: 0 to 10
    source: speech/src/vql_speech/flux/turn_detector.py:206 PATIENCE_MIN, PATIENCE_MAX
    verified: 2026-09-21
    reproduce: >-
      grep -n 'PATIENCE_MIN\|PATIENCE_MAX'
      ../speech/src/vql_speech/flux/turn_detector.py
      ../platform/backend/controlplane/app/domains/sessions/session_service.py
      sdk/python/src/voqalize/sdk/wire/frames.py
    note: >-
      The ends of the `stt.patience` scale, written out at every seat that can
      refuse one — the speech tier that owns the mapping, the control plane at
      `sessions.connect`, PyGato mid-call, and `SttConfig.__post_init__` in the
      SDK. They are duplicated because protobuf cannot carry a bound on a
      `uint32`, so unlike the languages and the voices there is no descriptor to
      read them off; the refusal sentence is derived from the constants at each
      seat rather than transcribed, so the seats cannot agree on the verdict and
      disagree on the words. Prose says "0 to 10"; `0..10` belongs only in code
      or a signature.
    forbid:
      - 'patience[^.]{0,40}\bscale from 0 to (?!10\b)\d+'
      - 'patience[^.]{0,40}\brange 0 to (?!10\b)\d+'

  stt.patience.default:
    value: 7
    source: speech/infra/deploy/env/prod.env:159,172 — derived, see note
    verified: 2026-09-21
    reproduce: >-
      grep -n 'VAD_EAGER_FRAMES\|VAD_STOP_FRAMES_TO_TRIGGER_UPDATE'
      ../speech/infra/deploy/env/prod.env ../speech/infra/deploy/env/dev.env &&
      grep -n 'update_frames + 1 + patience'
      ../speech/src/vql_speech/flux/turn_detector.py
    note: >-
      What an unset `stt.patience` runs at, and a **derived** number, so the
      derivation is the fact: `eager_frames_for_patience` is
      `eager_frames = update_frames + 1 + patience`, and both deployed
      environments set `VAD_EAGER_FRAMES=18` with
      `VAD_STOP_FRAMES_TO_TRIGGER_UPDATE=10`, giving `18 - 10 - 1 = 7`. Retune
      the tier and this moves, which is why it is pinned here rather than
      trusted where it is written — it is already spelled out in the SDK
      docstring (`wire/frames.py` `SttConfig.patience`) and in vql-speech's
      `flux/query_params.py`, and neither of those checks the other. vql-speech
      refuses to boot on an eager gate that is not a whole step on the scale,
      which keeps the mapping honest but says nothing about whether the number
      we published is still the one deployed. **Nothing writes a 7 onto the
      wire**: unset is what a default-patience session sends, which is what
      makes the field additive for a brain on an older SDK.
    forbid:
      - 'calibration[^.]{0,40}\bwhich is (?!7\b)\d+'
      - 'patience[^.]{0,30}\bdefaults? to (?!7\b)\d+'

  pipecat.version:
    value: '1.7.0'
    source: platform/backend/pygato/pyproject.toml:15
    verified: 2026-08-24
    reproduce: grep pipecat-ai ../platform/backend/pygato/pyproject.toml
    note: >-
      A floor (>=1.7.0), not a pin, and it is the voice tier's dependency rather
      than the customer's. 1.7.0 is load-bearing history: every conformance lane
      that passed before it had passed on 1.5.0, the version carrying L7, so all
      eleven were re-earned on 1.7.0. The changelog's "pipecat 1.2.1 -> 1.5.0" is
      a dated entry about 2026-07-07 and stays true as a record.

  pipecat.client.floor:
