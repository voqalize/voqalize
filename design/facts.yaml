      web. C++ also exists upstream but is not a Voqalize-supported environment
      until we state otherwise.

  pipecat.client.examples:
    value: [web]
    source: demos/*/frontend
    verified: 2026-08-28
    note: >-
      Every Voqalize demo client is a web frontend. Link the official Pipecat
      guide for React Native, iOS or Android and say plainly that Voqalize does
      not yet ship a native example; never turn upstream SDK availability into
      a claim that we tested an example we do not have.

  brain.frameworks.built_in:
    value: [Gemini]
    source: sdk/python/src/voqalize/sdk/gemini.py + sdk/python/src/voqalize/sdk/gemini_interactions.py
    verified: 2026-08-28
    note: >-
      GeminiBrain and GeminiInteractionsBrain are the two shipped adapters and
      both are behind the gemini extra. No ADK, LangChain or OpenAI Agents
      adapter ships. Other language/framework combinations implement the public,
      language-neutral protobuf wire and prove it with the conformance suite.

  brain.frameworks.extension_contract:
    value: language-neutral protobuf websocket plus conformance verification
    source: proto/voqalize/frames/frames.proto + sdk/python/src/voqalize/conformance/
    verified: 2026-08-28
    note: >-
      The English specification is the commented proto plus the wire reference.
      A coding agent may implement it in another language or around another
      framework, then run the conformance harness. Describe that as an
      implementation path, not as a first-party adapter.

  brain.hosting:
    value: inbound WebSocket by default; outbound Cortex supported and preferred for local development
    source: sdk/python/src/voqalize/sdk/session.py + sdk/python/src/voqalize/sdk/outbound.py
    verified: 2026-08-28
    note: >-
      Both paths run the same Brain and wire. Production builds toward an inbound
      wss route owned by the customer's application. Cortex is a supported relay
      for egress-only environments and is the documented local-development path
      because it needs no public tunnel.

  speech.stt.model:
    value: vql-stt
    source: platform/backend/pygato/src/pygato/session.py:98
    verified: 2026-08-25
    reproduce: >-
      grep -n '_STT_MODEL = ' ../platform/backend/pygato/src/pygato/session.py
    note: >-
      A composite router, the default, and the only one. Language selects the
      engine underneath; a brain never names an engine. Until 2026-08-25 this
      fact cited `docs/.../reference/catalog.md:39` as its source — the fact
      file citing the prose it exists to police, which makes the check a mirror
      of itself. The name is also an internal one and does not belong in
      customer-facing prose; see `lexicon.yaml internal_names`.

  speech.stt.languages.indic:
    value: 22
    source: speech/src/vql_speech/stt/engines/indic_conformer.py SUPPORTED_LANGUAGES
    verified: 2026-08-24
    reproduce: >-
      python3 -c "import re;print(len(re.findall(r'\"[a-z]{2,3}\",',
      open('../speech/src/vql_speech/stt/engines/indic_conformer.py').read())))"

  speech.stt.languages.total:
    value: 23
    source: speech/src/vql_speech/stt/engines/indic_conformer.py + English
    verified: 2026-08-24
    note: >-
      English plus 22 Indic languages. Say twenty-three, or say "English plus 22
      Indic languages"; the roster is in docs reference/catalog.md and nowhere
      else. The retired claim is "sixty-plus languages", which was never true of
      any model we host.
    forbid:
      - '\b(sixty|60)\+? languages'
      - '\b100\+? languages'

  speech.tts.clip_languages:
    value: 10
    source: platform/backend/pygato/src/pygato/session_config.py:43 TTS_CLIP_LANGUAGES
    verified: 2026-08-25
    reproduce: >-
      python3 -c "import re;t=open('../platform/backend/pygato/src/pygato/session_config.py').read();
      print(len(re.findall(r'Language\.\w+', re.search(r'TTS_CLIP_LANGUAGES = frozenset\((.*?)\)',
      t, re.S).group(1))))"
    note: >-
      **The number that makes "23 languages" a half-truth, and it has no
      derivable source in this repo.** `vql-stt` *hears* 23; there are recorded
      reference clips for 10 — bn, en, gu, hi, kn, ml, mr, pa, ta, te. A
      tts.language outside that set is refused at mint with the field named, so
      an Odia call is written `stt.language=OR, tts.language=HI` on purpose. A
      surface that says "23 languages" without saying which half is which is
      one clip away from the production bug this whole rule came from. Recorded
      here because a bare 23 invites exactly that sentence.
    forbid:
      # The wrong half asserted. "23 languages" alone is fine where the page
      # then says which ten are spoken — reference/catalog.md does exactly that
      # — so the pattern names the *verb*, which is what makes the claim false.
      - '\b(speaks|speaking|spoken in|voices in|say[s]?) (23|twenty-three) languages'
      - '\b(23|twenty-three) (voices|speakers|recorded)'

  speech.turn.eot_timeout_share:
    value: '8.6%'
    source: platform/backend/pygato/src/pygato/turn_strategies.py:44 (measured over 14 days of production)
    verified: 2026-08-26
    reproduce: >-
      grep -n '8.6% of real turns'
      ../platform/backend/pygato/src/pygato/turn_strategies.py
    note: >-
      The share of real turns closed by the silence deadline rather than by the
      turn detector being confident — which is why a committed turn is not
      always a finished thought. Load-bearing for the trade it justifies:
      withholding every timeout close would make all 8.6%% pay the full stall
      (~8 s of dead air), where answering the fragment costs one interruption.
      **The measurement window is a claim in a code comment, not a stamp** —
      nothing in either tree records when the 14 days were. Treat the window as
      unverified and re-measure before the number is repeated anywhere new.

  speech.interrupt.confidence:
    value: 0.45
    source: platform/backend/pygato/src/pygato/session.py:116 _INTERRUPT_CONFIDENCE
    verified: 2026-08-26
    reproduce: >-
      grep -n '_INTERRUPT_CONFIDENCE = '
      ../platform/backend/pygato/src/pygato/session.py
    note: >-
      The bar a transcription must clear to cut off speech in progress.
      Confidence ramps with how long real speech has been sustained, so a
      backchannel or a one-word garble stays under it and a sustained barge-in
      crosses it; the bar sits just under the 0.5 the recognizer carries at the
      barge-in point, so a genuine one clears with margin. **The accepted cost
      is that a short imperative may not land** — "stop" is exactly the shape
      that stays below the bar. Not a knob: it is paired with the speech tier's
      own barge-in setting and moving one alone desynchronises them. An idle
      caller is unaffected; any speech starts a fresh turn instantly.

  mcp.tools.rpm:
    value: 300
    source: platform/backend/controlplane/app/platform/ratelimit.py:59 MCP_TOOL_RPM
    verified: 2026-08-26
    reproduce: >-
      grep -rn 'MCP_TOOL_RPM' ../platform/backend/controlplane/app/
    note: >-
      Per workspace, per minute, on the MCP surface's own key namespace —
      charged at the membership check, so it lands only after membership is
      proven and an agent looping over sessions cannot spend the budget a page
      needs to start a call. The two unscoped tools (`whoami`, `list_tenants`)
      take no `tenant` and are not metered here.

  session.metadata.max_keys:
    value: 10
    source: platform/backend/controlplane/app/domains/sessions/documents.py:16 MAX_METADATA_KEYS
    verified: 2026-08-26
    reproduce: >-
      grep -n 'MAX_METADATA_KEYS\|MAX_METADATA_VALUE_LENGTH'
      ../platform/backend/controlplane/app/domains/sessions/documents.py
    note: >-
      Values are capped at 256 characters alongside. The cap is not a security
      control — it is the line between "labels I can recognise this call by" and
      "a place to keep application state", which is the caller's own database's
      job. `metadata` is not queryable, which is the other half of that line.

  speech.idle.default_ms:
    value: 0
    source: platform/backend/pygato/src/pygato/session_config.py:108 DEFAULT_IDLE_TIMEOUT_MS
    verified: 2026-08-25
    reproduce: >-
      grep -n 'DEFAULT_IDLE_TIMEOUT_MS\|MAX_IDLE_TIMEOUT_MS'
      ../platform/backend/pygato/src/pygato/session_config.py
    note: >-
      **Idle detection is off unless you ask for it.** Zero, because a nudge
      nobody asked for talks over a caller who was thinking. The ceiling is
      300000 ms — past a few minutes the caller has gone and the lever that
      helps is ending the session. Every page that prints `idle.timeout_ms`
      owes the reader the default, or `on_user_idle` reads like a callback that
      fires on its own.

  # ---- what we ship ---------------------------------------------------------

  demos.roster:
    value: [travel, shopping, support, servicing, interview_bot, sugar, legal,
            lead_qual, aura, forge, avatar, orderdesk]
    source: demos/manifest.json
    verified: 2026-09-01
    derive:
      file: demos/manifest.json
      json_pluck: {key: demos, field: name}
    note: >-
      The roster is the fact and the count is a projection of it, which is why
      this row is a list. A count answers "is the number right"; the roster
      answers "is anything missing", and that is the question worth asking —
      manifest.json is the registry, so it is the roster of record and anything
      else keeping its own list is the file that goes short.

      **No prose anywhere states how many demos there are.** Every count written
      here has gone stale, most of them within a release: pages said ten against
      a manifest of eleven, then eleven against twelve, and a build gate carried
      its own copy of the number until adding a demo turned the deploy red. A
      count carries no information a reader needs — nobody chooses Voqalize on
      the size of the gallery — and it is wrong the day the next demo lands. Say
      "our demos", "every demo", "the gallery"; if something genuinely must
      enumerate them, read this roster. A dated record — a changelog entry — may
      keep the number it was true with, because it is not a claim about now.
    forbid:
      - '\b(?:[Tt]en|[Ee]leven|[Tt]welve|[Tt]hirteen|\d{1,2}) (?:shipping )?(?:demos|demo agents)\b'
    except:
      - '**/changelog.astro'

  docs.pages:
    value: 41
    source: docs/src/content/docs/
    verified: 2026-08-26
    derive:
      glob: docs/src/content/docs/**/*.md*
    note: >-
      Forty-one pages, each served twice — rendered, and as the `.md` twin an
      agent reads — plus llms.txt and 404.html. It was 26 on the morning of
      2026-08-25 and the growth is not new writing: the tree was rebuilt
      top-down from the MCP handshake into an evaluation section plus four task
      sections whose names are their URL namespaces (Build, Designing for
      voice, Operate, Reference), which
      moved sixteen pages, dissolved Start into Build, folded
      `reference/no-provider-slot` into the catalog it was arguing with, merged
      `start/what-voqalize-is` into the apex, and opened thirteen new slots.
      Nine of those slots opened as scaffolds — one paragraph and an outline,
      each carrying a Scaffold aside so that a reader and a checker could both
      tell. **None remain as of 2026-08-26**: the five pages under
      `build/brain/`, `build/existing-agent`, `reference/brain` and
      `reference/errors` were written, and `reference/management-api` was the
      last, held open on a product decision rather than on effort. So the count
      is now a claim about coverage as well as about pages. If a Scaffold aside
      reappears, the page it is on is unwritten and this note is the record of
      what that means. Count this number the way the glob does; the four
      unpublished design outlines are not in it, because they are outlines in
      `design/` and not pages.

  # ---- the two URLs a developer types first ---------------------------------

  # Both of these reached a customer dead, reported 2026-09-01: an integrator hit
  # two broken links inside their first ten minutes, and both read as "this
  # product is broken" rather than "this line is stale". They are the first
  # request a new developer makes, so they are checked literally — inside code
  # fences, where a URL lives and where `forbid:` cannot see.

  host.api:
    value: app.voqalize.com
    source: platform/docs/decisions.md "api.voqalize.com does not exist and never did"
    verified: 2026-09-01
    reproduce: >-
      dig +short app.voqalize.com   # answers; api.voqalize.com is NXDOMAIN
    note: >-
      One host fronts the control plane, and it is the console's: the REST route
      that starts every call is POST https://app.voqalize.com/api/v1/sessions.connect.
      There is no api.* host in any environment and there never was — locally the
      control plane and the console likewise share app.local.voqalize.com. A doc
      naming an api.* host is stale, not a variant spelling, and the failure is
      total: the name does not resolve, so the reader gets a DNS error on the one
      route their own code calls.
    forbid_literal:
      - 'api\.(dev\.|local\.|prod\.)?voqalize\.com'

  host.mcp_endpoint:
    value: https://app.voqalize.com/mcp/
    source: platform/backend/controlplane/app/entrypoints/mcp/server.py MCP_MOUNT_PREFIX
    verified: 2026-09-01
    reproduce: >-
      curl -sS -o /dev/null -w '%{http_code}\n' -X POST https://app.voqalize.com/mcp/
      # 401 with a WWW-Authenticate challenge; /mcp without the slash is 405
    note: >-
      /mcp/ is the endpoint and the URL to configure: /mcp is the Starlette mount
      prefix and the streamable transport sits at that mount's root. Write it with
      the slash everywhere a reader will paste it — it answers directly, with no
      redirect hop.
      /mcp is no longer broken, though. It answered 405 with allow: GET until
      2026-09-01, because the console SPA's GET-only catch-all matched it and
      shadowed the redirect Starlette would otherwise have sent; the catch-all is
      registered only when the built console exists, so the failure appeared in
      deployed images and never locally. An explicit 307 in
      platform/backend/controlplane/app/entrypoints/http/app.py restores it,
      preserving method and body.
      Both spellings satisfy the OAuth resource check: check_resource_allowed in
      mcp.shared.auth_utils normalises trailing slashes before comparing, against
      the URL the client was configured with rather than the one it followed.
    forbid_literal:
      - 'voqalize\.com/mcp(?![/\w])'
    except:
      - design/facts.yaml

  # ---- commercial -----------------------------------------------------------

  pricing.state:
    value: free during developer preview
    source: platform/frontend/apps/marketing/src/pages/pricing.astro
    verified: 2026-08-24
    note: >-
      The only number on that page is $0 and it is the whole statement. There are
      no tiers, so no surface may name one. When pricing arrives the meter is
      session time — the seconds a session is live on the voice tier — never
      seats, agents, requests or tokens. We never resell tokens, because the
      brain runs in the reader's building and bills them directly.
    forbid:
      - '\bper[- ]seat\b'
      - '\bfree trial\b'

  preview.service_level:
    value: no availability guarantee; rate limiting and interruptions may occur
    source: product decision 2026-08-28
    verified: 2026-08-28
    note: >-
      Developer preview carries no SLA. State this before a developer treats a
      successful prototype as a production availability commitment. Do not
      invent an uptime percentage or a standard concurrent-call allowance.

  regions.current:
    value: India
    source: platform/frontend/apps/marketing/src/pages/privacy.astro:294
    verified: 2026-08-28
    reproduce: >-
      sed -n '286,302p'
      ../platform/frontend/apps/marketing/src/pages/privacy.astro
    note: >-
      Processing and storage are in India today. The deployed control plane and
      storage are asia-south1 and the voice tier runs in Indian data centres.

  regions.planned:
    value: United States
    source: product decision 2026-08-28
    verified: 2026-08-28
    note: >-
      Planned, not available. A page must keep the future tense and must not
      imply that a caller can select a US region today.

  session.data.stored:
    value: [session record, init, events, transcripts, logs, optional audio recordings]
    source: platform/backend/controlplane/app/domains/sessions/documents.py + app/domains/logs/
    verified: 2026-08-28
    reproduce: >-
      sed -n '65,125p'
      ../platform/backend/controlplane/app/domains/sessions/documents.py
    note: >-
      Transcripts are carried in the stored wire-event artifact rather than a
      separate transcript database. Audio exists only when recording resolved
      true for that session. The brain's own model history and logs remain in
      the developer's environment.

  session.data.retention:
    value: not configurable or guaranteed during developer preview
    source: product decision 2026-08-28
    verified: 2026-08-28
    note: >-
      Do not publish current bucket lifecycle rules as a customer contract.
      Fine-grained retention and access controls are planned for paid plans;
      neither their shape nor their dates are committed. Until then developers
      must avoid putting personal data in init and must not build compliance
      assumptions on a retention interval.

  pricing.direction:
    value: per session minute, all-inclusive except the developer's LLM
    source: product decision 2026-08-28
    verified: 2026-08-28
    note: >-
      Future paid pricing will include STT, TTS, endpointing, WebRTC, avatar,
      monitoring, observability and service availability. The brain and its LLM
      remain in the developer's environment and its model bill remains theirs.
      The price per minute is unset.

  limits.concurrent_calls:
    value: limited during developer preview; number unset
    source: product decision 2026-08-28
    verified: 2026-08-28
    note: >-
      Workspaces may be rate-limited and concurrent-call ceilings apply, but no
      public number exists. Ask before a pilot or launch; never print a guessed
      tier table.

  support.paid_direction:
    value: ticket support on paid plans; custom support contracts for enterprise plans
    source: product decision 2026-08-28
    verified: 2026-08-28
    note: >-
      A future commercial commitment, not a developer-preview SLA. No response
      time, severity schedule or launch date is committed yet.
