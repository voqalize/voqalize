# Build + deploy the demos runtime to Cloud Run (dev).
#
#   gcloud builds submit --config demos/cloudbuild.yaml \
#     --substitutions=_TRAVEL_AGENT=<id>,_TRAVEL_PK=<pk_...> .
#
# One image, every demo (see demos/Dockerfile). Build context is the repo root.
#
# This is a TEMPLATE. Fill in your own project, registry, service accounts, tenant,
# and secrets — the values below are placeholders. To run the demos in your own
# project, set _PROJECT / _REGION / _IMAGE / _CONTROLPLANE_API_URL / _DEMO_* and the
# secrets referenced in the deploy step. The publishable VITE_* values are baked
# into the UI at build; server secrets stay runtime env.
#
# Build identity: a least-privilege deploy SA — AR-writer on your registry,
# run.developer, build-bucket objectAdmin, logging.logWriter, and
# serviceAccountUser on the runtime SA. Pinned so a manual `gcloud builds submit`
# uses the same identity a trigger would. Requires logging: CLOUD_LOGGING_ONLY (set
# below). Swap this for your own build SA (or drop the line to use your default).
serviceAccount: projects/YOUR_GCP_PROJECT/serviceAccounts/YOUR_DEPLOYER_SA@YOUR_GCP_PROJECT.iam.gserviceaccount.com

substitutions:
  _REGION: YOUR_REGION
  _PROJECT: YOUR_GCP_PROJECT
  _SERVICE: voqalize-demos
  _IMAGE: ${_REGION}-docker.pkg.dev/${_PROJECT}/YOUR_REGISTRY/demos:latest
  # Control-plane origin the umbrella reverse-proxies /api/* to (session bootstrap).
  # The public vanity host (Firebase Hosting → control-plane Cloud Run) — no
  # internal Cloud Run URL leaks into this public config.
  _CONTROLPLANE_API_URL: https://app.dev.voqalize.com
  # Demo wiring baked into the UI (publishable — browser-safe). One agent id +
  # publishable key per demo; all share one tenant. Provisioned in Phase 4 and
  # passed via --substitutions at submit (empty here = an unprovisioned demo,
  # whose UI shows a clear "publishableKey is required" error).
  _DEMO_TENANT: ''
  _TRAVEL_AGENT: ''
  _TRAVEL_PK: ''
  _SHOPPING_AGENT: ''
  _SHOPPING_PK: ''
  _SUPPORT_AGENT: ''
  _SUPPORT_PK: ''
  _SERVICING_AGENT: ''
  _SERVICING_PK: ''
  _INTERVIEW_BOT_AGENT: ''
  _INTERVIEW_BOT_PK: ''
  _SUGAR_AGENT: ''
  _SUGAR_PK: ''
  _LEGAL_AGENT: ''
  _LEGAL_PK: ''
  _LEAD_QUAL_AGENT: ''
  _LEAD_QUAL_PK: ''
  _AURA_AGENT: ''
  _AURA_PK: ''

steps:
  # Build the image (frontend MPA + Python runtime, multi-stage).
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - build
      - -t
      - '${_IMAGE}'
      - -f
      - demos/Dockerfile
      - --build-arg
      - 'VITE_DEMO_TENANT=${_DEMO_TENANT}'
      - --build-arg
      - 'VITE_TRAVEL_AGENT=${_TRAVEL_AGENT}'
      - --build-arg
      - 'VITE_TRAVEL_PK=${_TRAVEL_PK}'
      - --build-arg
      - 'VITE_SHOPPING_AGENT=${_SHOPPING_AGENT}'
      - --build-arg
      - 'VITE_SHOPPING_PK=${_SHOPPING_PK}'
      - --build-arg
      - 'VITE_SUPPORT_AGENT=${_SUPPORT_AGENT}'
      - --build-arg
      - 'VITE_SUPPORT_PK=${_SUPPORT_PK}'
      - --build-arg
      - 'VITE_SERVICING_AGENT=${_SERVICING_AGENT}'
      - --build-arg
      - 'VITE_SERVICING_PK=${_SERVICING_PK}'
      - --build-arg
      - 'VITE_INTERVIEW_BOT_AGENT=${_INTERVIEW_BOT_AGENT}'
      - --build-arg
      - 'VITE_INTERVIEW_BOT_PK=${_INTERVIEW_BOT_PK}'
      - --build-arg
      - 'VITE_SUGAR_AGENT=${_SUGAR_AGENT}'
      - --build-arg
      - 'VITE_SUGAR_PK=${_SUGAR_PK}'
      - --build-arg
      - 'VITE_LEGAL_AGENT=${_LEGAL_AGENT}'
      - --build-arg
      - 'VITE_LEGAL_PK=${_LEGAL_PK}'
      - --build-arg
      - 'VITE_LEAD_QUAL_AGENT=${_LEAD_QUAL_AGENT}'
      - --build-arg
      - 'VITE_LEAD_QUAL_PK=${_LEAD_QUAL_PK}'
      - --build-arg
      - 'VITE_AURA_AGENT=${_AURA_AGENT}'
      - --build-arg
      - 'VITE_AURA_PK=${_AURA_PK}'
      - .

  - name: 'gcr.io/cloud-builders/docker'
    id: push
    waitFor: [build]
    args: [push, '${_IMAGE}']

  # Deploy to Cloud Run. Two secrets, both from Google Secret Manager (the deploy
  # service account needs secretAccessor on each):
  #   - gemini-api-key: the LLM key the brains run on (same one the control-plane
  #     demo brains use).
  #   - controlplane-pygato-pubkeys: dev PyGato's RS256 brain-token signer, wired to
  #     VOQALIZE_BRAIN_PUBKEYS. REQUIRED on a dev deploy — dev and prod sign with
  #     different keys, and the SDK's embedded fallback is the prod signer only, so
  #     without this every dev session's token fails verification (4000). A prod
  #     deploy can drop this and let the SDK fall back to its embedded prod key.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - --image
      - '${_IMAGE}'
      - --region
      - '${_REGION}'
      - --project
      - '${_PROJECT}'
      - --allow-unauthenticated
      - --set-env-vars
      - 'CONTROLPLANE_API_URL=${_CONTROLPLANE_API_URL}'
      - --set-secrets
      - 'GEMINI_API_KEY=gemini-api-key:latest,VOQALIZE_BRAIN_PUBKEYS=controlplane-pygato-pubkeys:latest'
      # Runtime identity: dedicated least-privilege SA (accessor on the two
      # secrets above only). The project default compute SA is disabled, so a
      # runtime SA must be named explicitly.
      - --service-account
      - YOUR_RUNTIME_SA@YOUR_GCP_PROJECT.iam.gserviceaccount.com
      - --quiet

images:
  - '${_IMAGE}'

options:
  logging: CLOUD_LOGGING_ONLY
