<!--
  Voqalize · Aria for karnatakadigital.in
  Paste this whole block into Elementor Pro → Custom Code (Location: </body> - End).
  Nothing downloads until a visitor clicks "Talk to Aria". Remove the snippet to remove Aria.
-->
<style>
  #vq-aria { position: fixed; right: 20px; bottom: 20px; z-index: 2147483000;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1b1b1f; }
  #vq-aria * { box-sizing: border-box; }
  #vq-aria .vq-launch { display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 10px;
    border: 0; border-radius: 999px; background: #0b4f8a; color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; line-height: 1;
    box-shadow: 0 6px 20px rgba(0,0,0,.18); cursor: pointer; }
  #vq-aria .vq-launch svg { width: 36px; height: 36px; padding: 7px; border-radius: 50%; background: rgba(255,255,255,.18); }
  #vq-aria .vq-panel { width: 320px; max-width: calc(100vw - 32px); border-radius: 16px; background: #fff;
    box-shadow: 0 12px 40px rgba(0,0,0,.22); overflow: hidden; }
  #vq-aria .vq-face { height: 300px; background: #e8eef5; }
  #vq-aria .vq-status { padding: 10px 14px 0; font-size: 13px; color: #55575f; min-height: 28px; }
  #vq-aria .vq-links { padding: 0 14px; display: grid; gap: 6px; }
  #vq-aria .vq-links a { display: block; padding: 8px 10px; border-radius: 8px; background: #eef4fa;
    color: #0b4f8a; font-weight: 600; text-decoration: none; }
  #vq-aria .vq-bar { display: flex; gap: 8px; padding: 12px 14px 14px; }
  #vq-aria .vq-bar button { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid #c9ccd3;
    background: #fff; color: #1b1b1f; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1; cursor: pointer; }
  #vq-aria .vq-bar .vq-end { background: #b3261e; border-color: #b3261e; color: #fff; }
  #vq-aria [hidden] { display: none !important; }
  @media (max-width: 480px) { #vq-aria { right: 12px; bottom: 12px; } #vq-aria .vq-face { height: 240px; } }
</style>

<script type="module">
  // ── 1. Configuration (filled in by Voqalize) ─────────────────────────────
  const VQ = {
    agentId: "REPLACE_WITH_KDEM_AGENT_ID",
    publishableKey: "pk_live_REPLACE_WITH_KDEM_KEY", // works only on karnatakadigital.in
    character: "tara",                                // female avatar; voice (Gauri) is set by Voqalize
    api: "https://app.voqalize.com/api/v1/sessions.connect",
  };
  // Pinned library versions, loaded from jsDelivr only when a visitor clicks.
  const LIBS = {
    client: "https://cdn.jsdelivr.net/npm/@pipecat-ai/client-js@1.13.1/+esm",
    transport: "https://cdn.jsdelivr.net/npm/@pipecat-ai/small-webrtc-transport@1.10.8/+esm",
    avatar: "https://cdn.jsdelivr.net/npm/@voqalize/avatar@0.5.4/+esm",
  };

  // ── 2. The launcher and panel (one element, styles scoped to #vq-aria) ───
  const root = document.createElement("div");
  root.id = "vq-aria";
  root.innerHTML = `
    <button class="vq-launch" type="button" aria-label="Talk to Aria, KDEM's voice assistant">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      <span class="vq-label">Talk to Aria</span>
    </button>
    <div class="vq-panel" role="dialog" aria-label="Aria, KDEM assistant" hidden>
      <div class="vq-face"></div>
      <div class="vq-status" aria-live="polite"></div>
      <div class="vq-links"></div>
      <div class="vq-bar">
        <button class="vq-mute" type="button" aria-pressed="false">Mute</button>
        <button class="vq-end" type="button">End</button>
      </div>
      <audio autoplay></audio>
    </div>`;
  document.body.appendChild(root);

  const $ = (s) => root.querySelector(s);
  const launch = $(".vq-launch"), panel = $(".vq-panel"), face = $(".vq-face");
  const statusEl = $(".vq-status"), links = $(".vq-links"), audio = $("audio");
  const muteBtn = $(".vq-mute"), endBtn = $(".vq-end"), label = $(".vq-label");

  let client = null, avatar = null, busy = false, muted = false;
  const say = (text) => { statusEl.textContent = text; };

  // ── 3. Start a conversation ──────────────────────────────────────────────
  async function start() {
    if (busy || client) return;
    busy = true;
    launch.hidden = true;
    panel.hidden = false;
    label.textContent = "Talk to Aria";
    say("Connecting…");
    links.replaceChildren();

    try {
      const [{ PipecatClient }, { SmallWebRTCTransport }, { createAvatar }] = await Promise.all([
        import(LIBS.client), import(LIBS.transport), import(LIBS.avatar),
      ]);

      const next = new PipecatClient({
        transport: new SmallWebRTCTransport(),
        enableMic: true,
        enableCam: false,
        callbacks: {
          onTransportStateChanged: (state) => {
            if (client !== next) return;
            if (state === "ready") say("Listening. Just talk.");
            if (state === "disconnected") stop();
          },
          onBotStartedSpeaking: () => say("Aria is speaking…"),
          onBotStoppedSpeaking: () => say("Listening. Just talk."),
          // The avatar draws but plays no sound: Aria's voice is attached here.
          onTrackStarted: (track, participant) => {
            if (participant?.local || track.kind !== "audio") return;
            audio.srcObject = new MediaStream([track]);
            audio.play().catch(() => {});
          },
          // Aria can offer a KDEM page as a link card; it opens in a new tab
          // so the conversation keeps going.
          onUICommand: ({ command, payload }) => {
            if (command !== "show_link" || !payload?.url) return;
            const url = new URL(payload.url, location.origin);
            if (!/(^|\.)karnatakadigital\.in$/.test(url.hostname)) return;
            const a = document.createElement("a");
            a.href = url.href; a.target = "_blank"; a.rel = "noopener";
            a.textContent = payload.title || url.pathname;
            links.prepend(a);
            while (links.children.length > 3) links.lastChild.remove();
          },
        },
      });
      client = next;

      // Mount the face before connecting, so it is ready for Aria's greeting.
      avatar = createAvatar({ mount: face, client: next, character: VQ.character });

      // ── 4. One request to Voqalize, then a direct WebRTC connection ───────
      const started = await next.startBot({
        endpoint: VQ.api,
        headers: new Headers({ Authorization: `Bearer ${VQ.publishableKey}` }),
        requestData: {
          agent_id: VQ.agentId,
          init: { surface: "kdem-web", page: location.pathname, lang: document.documentElement.lang || "en" },
        },
      });
      await next.connect(withRealHeaders(started));
    } catch (error) {
      console.warn("[Voqalize] could not start Aria:", error);
      await stop();
      launch.hidden = false;
      label.textContent = "Aria is unavailable. Try again";
    } finally {
      busy = false;
    }
  }

  // The session's connection details arrive as JSON; Pipecat needs real Headers.
  function withRealHeaders(p) {
    return {
      ...p,
      webrtc_request_params: {
        ...p.webrtc_request_params,
        headers: new Headers(p.webrtc_request_params?.headers ?? {}),
      },
    };
  }

  // ── 5. End, mute and clean up ────────────────────────────────────────────
  async function stop() {
    const live = client;
    client = null;
    avatar?.destroy(); avatar = null;
    audio.srcObject = null;
    muted = false; muteBtn.textContent = "Mute"; muteBtn.setAttribute("aria-pressed", "false");
    panel.hidden = true;
    launch.hidden = false;
    await live?.disconnect().catch(() => {});
  }

  launch.addEventListener("click", start);
  endBtn.addEventListener("click", stop);
  muteBtn.addEventListener("click", () => {
    if (!client) return;
    muted = !muted;
    client.enableMic(!muted);
    muteBtn.textContent = muted ? "Unmute" : "Mute";
    muteBtn.setAttribute("aria-pressed", String(muted));
  });
  // Leaving the page hangs up, so the microphone is never left open.
  addEventListener("pagehide", () => { client?.disconnect(); });
</script>
