[project]
name = "voqalize-demos"
version = "0.1.0"
requires-python = ">=3.12"
# The demos backend: one umbrella FastAPI app that hosts every demo brain (dialed
# by Voqalize at /{name}/s/{session_id}) and serves the built demo UIs. It depends
# on the public brain SDK **by path** (workspace source) — this is the deployable
# dogfooding of the public contract: the demos build against the same SDK a
# customer would.
dependencies = [
    "voqalize-agent-sdk",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.0",
    "loguru>=0.7",
    "httpx>=0.27",
    # RS256 verification of Voqalize's brain token needs a crypto backend. pyjwt
    # alone can't verify RS256; the brain host is the party that verifies, so the
    # backend must pull it in explicitly.
    "pyjwt[crypto]>=2.8",
]

[tool.uv.sources]
# In-repo path dep — resolves inside this repo's own build context (unlike the
# private controlplane image, which cannot COPY a sibling repo). This is why the
# demos runtime is the first deployable consumer of the public SDK.
voqalize-agent-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voqalize_demos"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    # Test-only: mint RS256 brain tokens for the conformance harness.
    "cryptography>=43",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
