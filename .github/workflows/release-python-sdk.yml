# Publish `voqalize-agent-sdk` to PyPI from a tag.
#
#   git tag python-sdk-v0.0.1 && git push origin main --follow-tags
#
# The tag is package-prefixed because this repo used to hold a second publishable
# SDK on its own series — `@voqalize/client-react`, deprecated 2026-08-24 with
# nothing further to publish. The prefix stays: it costs nothing, and a bare
# `v0.0.1` would be ambiguous again the first time a second package ships.
#
# No long-lived credential lives here. PyPI accepts an OIDC token this workflow
# mints for this repository and this environment; see sdk/python/RELEASING.md for
# the one-time setup.
name: release python sdk

on:
  push:
    tags: ["python-sdk-v[0-9]+.[0-9]+.[0-9]+", "python-sdk-v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch: # re-run a failed publish without re-tagging

permissions:
  contents: read

jobs:
  guard:
    name: tag matches the manifest
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#python-sdk-v}"
          manifest=$(grep -m1 '^version = ' sdk/python/pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag  pyproject=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag disagrees with sdk/python/pyproject.toml ($manifest)"
            exit 1
          fi
          # A release with no changelog entry is one nobody can read the diff of.
          grep -q "^## ${tag}\$" sdk/python/CHANGELOG.md || {
            echo "::error::sdk/python/CHANGELOG.md has no '## ${tag}' section"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  ci:
    name: ci
    needs: guard
    uses: ./.github/workflows/ci.yml

  build:
    name: build sdist + wheel
    needs: [guard, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: build
        working-directory: sdk/python
        run: uv build --out-dir dist

      # The SDK is pure Python and must stay that way: a platform-tagged wheel
      # here would mean something started compiling, and `pip install` would go
      # quiet on every platform that didn't get one.
      - name: check the artifacts before uploading
        working-directory: sdk/python
        run: |
          set -euo pipefail
          ls -la dist
          v="${{ needs.guard.outputs.version }}"
          test -f "dist/voqalize_agent_sdk-${v}.tar.gz"      || { echo "::error::no sdist for ${v}"; exit 1; }
          test -f "dist/voqalize_agent_sdk-${v}-py3-none-any.whl" || { echo "::error::no pure wheel for ${v}"; exit 1; }
          [ "$(ls dist/*.whl | wc -l)" -eq 1 ] || { echo "::error::expected exactly one wheel"; exit 1; }

      # The stubs are generated, committed, and pinned to protoc v29.3 so they
      # run on protobuf 5.29+ and 6.x alike. Installing the wheel against the
      # oldest supported runtime is what proves that claim, rather than the
      # comment in pyproject.toml asserting it.
      - name: import the wheel on the oldest supported protobuf
        working-directory: sdk/python
        run: |
          set -euo pipefail
          uv venv /tmp/floor --python 3.12
          VIRTUAL_ENV=/tmp/floor uv pip install "protobuf==5.29.3" dist/*.whl
          VIRTUAL_ENV=/tmp/floor uv run --no-project python -c "
          import google.protobuf, voqalize.sdk
          from voqalize.sdk.wire import _frames_pb2 as fp
          e = fp.Envelope(); e.ack.SetInParent()
          assert fp.Envelope.FromString(e.SerializeToString()) == e
          print('ok on protobuf', google.protobuf.__version__)
          "

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: sdk/python/dist/

  pypi:
    name: publish voqalize-agent-sdk
    needs: [guard, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # mints the OIDC token PyPI exchanges for a publish grant
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    name: github release
    needs: [guard, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes diffs against the previous tag
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --title "voqalize-agent-sdk ${{ needs.guard.outputs.version }}" \
            --generate-notes
