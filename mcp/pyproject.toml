[project]
name = "voqalize-mcp"
version = "0.1.0"
description = "Voqalize MCP server — manage voice agents from inside your Claude Code."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28",
    "httpx>=0.28.1",
]

[project.scripts]
voqalize-mcp = "voqalize_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voqalize_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
